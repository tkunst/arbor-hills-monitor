name: scoped-test-send

# Manual, attended-only trigger for a [TEST] email to exactly ONE address --
# see scripts/send_scoped_test.py. Unlike daily.yml's send_test input (which
# hits the WHOLE resolved recipient list every time), this reaches only the
# address given, so repeated footer/config checks don't re-notify everyone
# else on the alert list. workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Single email address to send the scoped test to"
        type: string
        required: true
      kind:
        description: "basic = one-line check; digest = preview of next Sunday's digest (read-only)"
        type: choice
        options: [basic, digest]
        default: basic

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Write service-account key to a temp file (digest preview only)
        if: ${{ inputs.kind == 'digest' }}
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Send scoped test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MONITOR_OWNER_EMAILS: ${{ secrets.MONITOR_OWNER_EMAILS }}
          UNSUBSCRIBED_EMAILS: ${{ secrets.UNSUBSCRIBED_EMAILS }}
          # workflow_dispatch input, operator-supplied (not untrusted event
          # data); read by Python via os.environ — never shell-evaluated.
          SCOPED_TEST_RECIPIENT: ${{ inputs.recipient }}
          SCOPED_TEST_KIND: ${{ inputs.kind }}
          # Digest preview reads the public Sheet's _meta queue (read-only).
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scripts/send_scoped_test.py
