name: create-oauth-folder

# One-off helper (manual only): create a NEW app-only Drive folder using the
# EXISTING GOAUTH creds, so an additional mirror (e.g. the GFL air exhibit, ADR
# 026) can be provisioned when the original OAuth client JSON isn't on hand —
# scripts/oauth_setup.py needs that JSON + a browser; this doesn't. It only mints
# a Drive service from the stored refresh token, creates ONE empty folder, and
# prints its ID in the run log. You then store the ID as the folder-ID secret and
# flip the stream's capture flag. Reads/modifies no monitoring data.
on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: "Name of the Drive folder to create"
        type: string
        required: true
      parent_folder_id:
        description: "Optional: create directly under this existing Drive folder ID (omit to create at root, then move by hand)"
        type: string
        required: false
      identity:
        description: "Which OAuth identity creates the folder: 'default' (the original shared GOAUTH_* creds) or 'kunst' (the kunst.trisha GOAUTH_*_KUNST migration creds — the migration target)"
        type: choice
        required: false
        default: "default"
        options:
          - "default"
          - "kunst"

permissions:
  contents: read

jobs:
  create-folder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create the folder
        env:
          # Pick the OAuth identity: 'kunst' -> the kunst.trisha migration creds
          # (GOAUTH_*_KUNST), anything else -> the original shared GOAUTH_* creds.
          GOAUTH_CLIENT_ID: ${{ inputs.identity == 'kunst' && secrets.GOAUTH_CLIENT_ID_KUNST || secrets.GOAUTH_CLIENT_ID }}
          GOAUTH_CLIENT_SECRET: ${{ inputs.identity == 'kunst' && secrets.GOAUTH_CLIENT_SECRET_KUNST || secrets.GOAUTH_CLIENT_SECRET }}
          GOAUTH_REFRESH_TOKEN: ${{ inputs.identity == 'kunst' && secrets.GOAUTH_REFRESH_TOKEN_KUNST || secrets.GOAUTH_REFRESH_TOKEN }}
          FOLDER_NAME: ${{ inputs.folder_name }}
          PARENT_FOLDER_ID: ${{ inputs.parent_folder_id }}
        run: python scripts/create_oauth_folder.py
