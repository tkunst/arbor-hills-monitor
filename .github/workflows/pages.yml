name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # findings-feed.yml commits its regenerated site/public-records/ straight to
  # `main` using the default GITHUB_TOKEN — and pushes made with that token
  # are deliberately excluded from re-triggering `push`-triggered workflows
  # (GitHub's anti-recursion rule), so the `push` trigger above alone would
  # never see that commit. workflow_run is the standard escape hatch: it
  # fires on any completed run of the named workflow regardless of which
  # token performed the underlying commit. Gated to `success` below so a
  # FAILED regeneration (which never committed anything) doesn't trigger a
  # pointless redeploy. Residual, accepted: a SUCCESSFUL no-op run (nothing
  # changed, so findings-feed.yml made no commit -- see its own diff-quiet
  # guard) still fires this and redeploys the unchanged site/ artifact. That
  # redeploy is harmless and idempotent (same content, new deploy id), just
  # wasted CI minutes once a day -- not worth a second signal (e.g. a
  # commit-sha comparison) to suppress.
  workflow_run:
    # fulltext-index: redeploy once a new full-text search bundle is built
    # (ADR 062 addendum), so the bundle is never a day behind the feed.
    workflows: ["findings-feed", "fulltext-index"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run's default ref/SHA resolution points at the state
          # findings-feed started from, not the commit it just pushed (that
          # push already landed on `main` by the time this "completed" event
          # fires, since it happens inside the same, now-finished run) — so
          # check out `main` explicitly rather than trust the event's default.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Full-text search flag
        id: fulltext
        run: python3 scripts/fulltext_flag.py >> "$GITHUB_OUTPUT"
      - name: Restore the newest full-text search bundle
        # Built and cached by fulltext-index.yml (never committed). If none is
        # cached, or the flag is off, the page deploys without it and the
        # full-text toggle simply never appears (search.js only shows it when
        # fulltext/coverage.json exists).
        if: steps.fulltext.outputs.enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .fulltext-bundle
          key: fulltext-bundle-v1-${{ github.run_id }}
          restore-keys: fulltext-bundle-v1-
      - name: Place the bundle next to the public records page
        if: steps.fulltext.outputs.enabled == 'true'
        # Only a bundle that matches the CURRENT published index and denylist and
        # is at most 2 days old is deployed (scripts/fulltext_bundle_ok.py); a
        # stale one is left out, so a withdrawn document or a newly listed name
        # can never stay searchable.
        run: |
          if [ -f .fulltext-bundle/coverage.json ] && \
             python3 scripts/fulltext_bundle_ok.py .fulltext-bundle site/public-records/search-index.json | grep -q '^ok=true$'; then
            rm -rf site/public-records/fulltext
            cp -R .fulltext-bundle site/public-records/fulltext
            rm -f site/public-records/fulltext/bundle-manifest.json
            echo "full-text bundle placed"
          else
            echo "::warning::full-text bundle missing or stale; deploying without full-text search"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
