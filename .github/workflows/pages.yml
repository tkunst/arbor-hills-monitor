name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # findings-feed.yml commits its regenerated site/public-records/ straight to
  # `main` using the default GITHUB_TOKEN — and pushes made with that token
  # are deliberately excluded from re-triggering `push`-triggered workflows
  # (GitHub's anti-recursion rule), so the `push` trigger above alone would
  # never see that commit. workflow_run is the standard escape hatch: it
  # fires on any completed run of the named workflow regardless of which
  # token performed the underlying commit. Gated to `success` below so a
  # FAILED regeneration (which never committed anything) doesn't trigger a
  # pointless redeploy. Residual, accepted: a SUCCESSFUL no-op run (nothing
  # changed, so findings-feed.yml made no commit -- see its own diff-quiet
  # guard) still fires this and redeploys the unchanged site/ artifact. That
  # redeploy is harmless and idempotent (same content, new deploy id), just
  # wasted CI minutes once a day -- not worth a second signal (e.g. a
  # commit-sha comparison) to suppress.
  workflow_run:
    # fulltext-index: redeploy once a new full-text search bundle is built
    # (ADR 062 addendum), so the bundle is never a day behind the feed.
    workflows: ["findings-feed", "fulltext-index"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lastcheck:
    # The homepage GlanceCard's "Last checked" line: when the last SCHEDULED
    # daily.yml run (the watcher that checks EGLE's filing systems) ended in
    # success. A manual run (e.g. a test-email send) never counts. Its own job
    # so only it holds `actions: read` (the deploy job keeps its token scope)
    # and no repo code runs with it. Best-effort: on any API error the value is
    # blank, the line is simply not shown, and the deploy still runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
    outputs:
      at: ${{ steps.q.outputs.at }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          at=$(gh run list -R "$REPO" --workflow daily.yml --event schedule \
                 --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // ""' 2>/dev/null || true)
          case "$at" in 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T*Z) ;; *) at="" ;; esac
          echo "at=$at" >> "$GITHUB_OUTPUT"

  deploy:
    needs: lastcheck
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run's default ref/SHA resolution points at the state
          # findings-feed started from, not the commit it just pushed (that
          # push already landed on `main` by the time this "completed" event
          # fires, since it happens inside the same, now-finished run) — so
          # check out `main` explicitly rather than trust the event's default.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Full-text search flag
        id: fulltext
        run: python3 scripts/fulltext_flag.py >> "$GITHUB_OUTPUT"
      - name: Restore the newest full-text search bundle
        # Built and cached by fulltext-index.yml (never committed). If none is
        # cached, or the flag is off, the page deploys without it and the
        # full-text toggle simply never appears (search.js only shows it when
        # fulltext/coverage.json exists).
        if: steps.fulltext.outputs.enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .fulltext-bundle
          key: fulltext-bundle-v1-${{ github.run_id }}
          restore-keys: fulltext-bundle-v1-
      - name: Place the bundle next to the public records page
        if: steps.fulltext.outputs.enabled == 'true'
        # Only a bundle that matches the CURRENT published index and denylist and
        # is at most 2 days old is deployed (scripts/fulltext_bundle_ok.py); a
        # stale one is left out, so a withdrawn document or a newly listed name
        # can never stay searchable.
        run: |
          if [ -f .fulltext-bundle/coverage.json ] && \
             python3 scripts/fulltext_bundle_ok.py .fulltext-bundle site/public-records/search-index.json | grep -q '^ok=true$'; then
            rm -rf site/public-records/fulltext
            cp -R .fulltext-bundle site/public-records/fulltext
            rm -f site/public-records/fulltext/bundle-manifest.json
            echo "full-text bundle placed"
          else
            echo "::warning::full-text bundle missing or stale; deploying without full-text search"
          fi
      - name: Fill the homepage glance card
        # Count + newest filing from site/public-records/glance.json, plus the
        # Last checked time from the lastcheck job (shown only when 48 hours old
        # or less). Standard library only; never fails the deploy
        # (scripts/fill_home_glance.py).
        env:
          LAST_CHECK_AT: ${{ needs.lastcheck.outputs.at }}
        run: python3 scripts/fill_home_glance.py
      - name: Configure Pages
        # A run triggered by fulltext-index only matters when full text is on;
        # with the flag off it would just redeploy the same site a second time
        # each day, so those runs skip deploying.
        if: github.event.workflow_run.name != 'fulltext-index' || steps.fulltext.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Upload site/ as the Pages artifact
        if: github.event.workflow_run.name != 'fulltext-index' || steps.fulltext.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        if: github.event.workflow_run.name != 'fulltext-index' || steps.fulltext.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    # Each upload above stores the whole site/ (~65 MB with the full-text bundle)
    # as a "github-pages" artifact kept for 1 day. On 2026-11-05 eight deploys in 3
    # hours stored 539 MB, past the free plan's 0.5 GB Actions storage, and the
    # account was locked (no Actions ran on 11/6). Once the deploy job is over the
    # artifact is no longer needed: delete this run's and any earlier run's
    # still-unexpired leftover. Runs after a FAILED deploy too (a failed upload or
    # deploy would otherwise leave 65 MB behind for a day; re-running the failed
    # job uploads again) and after a cancelled one (always()). A separate job so
    # only it holds `actions: write`. The workflow-level `concurrency: pages`
    # covers this job, so no other run is between its upload and deploy while
    # this deletes. Only the name "github-pages" is ever touched. A failed list
    # or delete turns the run red (so it's seen) but never undoes the deploy.
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the github-pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/artifacts?name=github-pages&per_page=100" --paginate \
                  --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
          n=0; failed=0
          for id in $ids; do
            # Output is never printed: gh's error text names the artifact id.
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              n=$((n+1))
            elif state=$(gh api "repos/$REPO/actions/artifacts/$id" --jq '.expired' 2>&1); then
              # still listed: a failure unless it expired meanwhile
              [ "$state" = "true" ] || failed=$((failed+1))
            else
              # only a real 404 means it's gone (the DELETE may have landed before
              # gh saw an error): counted as deleted; any other error is a failure
              case "$state" in *"HTTP 404"*) n=$((n+1)) ;; *) failed=$((failed+1)) ;; esac
            fi
          done
          echo "deleted $n github-pages artifact(s); $failed delete(s) failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed github-pages artifact(s) could not be deleted; Actions storage may fill up"
            exit 1
          fi
