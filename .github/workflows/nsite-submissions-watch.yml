name: nsite-submissions-watch

# nSITE Submissions watch (Stream K, ADR 020): daily watch on EGLE's nSITE
# Submissions profile (application/service-request intake) for every facility
# in config.yml's `facilities:` list — a SIBLING profile to the Documents feed
# the monitor already polls, added after a JPA (wetlands/floodplain permit
# application) reached Trisha only via her personal MiEnviro email
# subscription. Emails an alert distinguishing a brand-new filing from an
# existing one's status advancing, vs the last snapshot in the "Submissions
# Watch" tab. First sighting of each facility's Submissions list baselines
# silently.
#
# Ships nsite_submissions.enabled: true (Trisha directed this build live and
# it was verified against a real workflow_dispatch run before merging — see
# the ADR). No Anthropic (a deterministic extractor, not the Claude
# classifier) and no Drive/OAuth (the deliverable is the alert + the durable
# Sheet row, same scope call as rop_watcher/mmd_watcher/ride_watcher). 1pm ET
# continues the sequential slotting after pfas(7am)/rop(10am)/mmd(11am)/
# ride(12pm); state is the "Submissions Watch" tab, NOT _meta, so it never
# races the other jobs.
on:
  schedule:
    - cron: "0 18 * * *"    # 1pm ET (6pm UTC). DST drift of +/-1h is acceptable.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nsite-submissions-watch
  cancel-in-progress: false

jobs:
  nsite-submissions-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Watch nSITE Submissions for changes
        env:
          # Sheets I/O uses the service account; the change alert uses SMTP.
          # No Anthropic (nothing to classify) and no OAuth (no Drive mirror).
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_RECIPIENTS_EXTRA: ${{ secrets.ALERT_RECIPIENTS_EXTRA }}
        run: python nsite_submissions_watcher.py
