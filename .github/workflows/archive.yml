name: archive

# Durable PDF mirror (ADR 007): copies each processed N2688 PDF into Trisha's
# Drive (OAuth-as-user) as insurance against nSITE link rot, and records it in
# the "Archived PDFs" tab. Self-terminating and idempotent.
#
# Safe to leave scheduled from day one: if the GOAUTH_* secrets aren't set yet,
# the job is a quiet no-op (exit 0). Once they're set it mirrors whatever the
# backfill has processed so far, growing alongside it. No Claude, no email —
# just download + upload. coder:mirror-ocr (2026-10-13): the upload now runs
# every PDF through ocrmypdf if it needs it (archive_client.upload_file(),
# fail-open) — this catch-up path re-downloads raw from nSITE and never went
# through the classification pipeline's own OCR step, so it's the most likely
# source of the pre-fix scan-only mirrors.
on:
  schedule:
    - cron: "0 8 * * *"    # 3am ET (8am UTC), after the 2am backfill.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system OCR tooling
        # continue-on-error (found by the advisor, 2026-10-13): a flaky apt
        # mirror must never fail this whole job -- ensure_searchable()/
        # ocr_in_place() already fail open when ocrmypdf is missing, and
        # ridgewood.yml's H2S safety-alert logic specifically must not
        # depend on this step succeeding (ADR 016).
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ocrmypdf
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Mirror a batch of PDFs
        env:
          # Sheets I/O uses the service account (drive.file grants no Sheets
          # access); the Drive upload uses the OAuth user client. Hence both.
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOAUTH_CLIENT_ID: ${{ secrets.GOAUTH_CLIENT_ID_KUNST }}
          GOAUTH_CLIENT_SECRET: ${{ secrets.GOAUTH_CLIENT_SECRET_KUNST }}
          GOAUTH_REFRESH_TOKEN: ${{ secrets.GOAUTH_REFRESH_TOKEN_KUNST }}
          GOAUTH_ARCHIVE_FOLDER_ID: ${{ secrets.GOAUTH_ARCHIVE_FOLDER_ID }}
        run: python archiver.py
