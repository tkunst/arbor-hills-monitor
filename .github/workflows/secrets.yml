name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # We run the gitleaks CLI directly rather than gitleaks-action@v2 because
      # the action's incremental mode diffs against the parent of the pushed
      # range, which doesn't exist on a repo's first commit (it computes
      # `<initial-commit>^..HEAD` and git errors out before scanning). The CLI's
      # `detect` scans the FULL history deterministically — works on the initial
      # push, subsequent pushes, and PRs alike. Exits non-zero if any leak found.
      - name: Install gitleaks
        # Downloaded to disk first and checked against gitleaks' own published
        # SHA-256 (from its release's checksums.txt) before extracting, rather
        # than piping curl straight into sudo tar. Bump the hash alongside VER.
        run: |
          set -euo pipefail
          VER=8.24.3
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          TARBALL="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSL -o "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$TARBALL" gitleaks
          gitleaks version
      - name: Scan full git history for secrets
        run: gitleaks detect --redact -v --no-banner
