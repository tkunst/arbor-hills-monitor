name: oneoff-release-license-notes

# ONE-OFF (deleted in the next commit, never merged to main): append a CC BY 4.0
# license statement to the notes of the four dataset releases. Idempotent: a
# release whose notes already link the CC BY 4.0 URL is skipped.
on:
  push:
    branches: [claude/warp-sessions-mac-i8w5v1]
    paths: ['.github/workflows/oneoff-release-license-notes.yml']

permissions:
  contents: write

jobs:
  edit-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Append license statement to dataset release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > note.md <<'EOF'
          ---

          **License:** [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Reuse freely, crediting "Arbor Hills Monitor" with a link to the dataset page on [arborhillsmonitor.org/data/](https://arborhillsmonitor.org/data/). The underlying readings are public regulatory records; the license covers this project's compilation, parsing, and documentation.
          EOF
          for tag in wellfield-data-2026-08-24 wellhead-h2s-annual-2026-09-05 perimeter-air-data-2026-08-04 flagged-wells-2026-08-07; do
            body="$(gh release view "$tag" --json body -q .body)"
            if grep -q 'creativecommons.org/licenses/by/4.0' <<<"$body"; then
              echo "$tag: already has the license statement, skipping"
              continue
            fi
            { printf '%s\n\n' "$body"; cat note.md; } > notes-"$tag".md
            gh release edit "$tag" --notes-file notes-"$tag".md
            echo "$tag: license statement appended"
          done
