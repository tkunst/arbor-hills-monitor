name: oneoff-meeting-watch-keyword-backfill

# TEMPORARY, one-time 12-month CivicClerk keyword-watch historical backfill
# (ADR 036) — scans the past 12 months across categories 68 (DPA)/72 (MMPC)/
# 26+27 (BOC) for the Arbor Hills keyword set and emails Trisha one summary
# report, silently baselining what it finds. Delete this file and
# scripts/oneoff_meeting_watch_keyword_backfill.py once the send is confirmed
# — this is not a capability the repo carries forward (the ONGOING watch lives
# in civicclerk_watcher.run(), scheduled by meeting-watch.yml).
#
# workflow_dispatch only — never on a schedule, and safe to run more than once
# by construction: it only WRITES a baseline row for an event that doesn't
# already have one (never touches an existing baseline), so a second run is a
# report-only no-op for anything the first run already recorded.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Shares meeting-watch.yml's concurrency group — both write to the same
# append-only Meeting Watch tab (CLAUDE.md's "Workflows use a concurrency
# group so two runs never race the state file" invariant); a manually-
# dispatched backfill running at the same moment as the twice-daily
# scheduled watch must not race it.
concurrency:
  group: meeting-watch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Run the 12-month keyword backfill
        env:
          # Sheets I/O uses the service account (baseline rows); the summary
          # report uses SMTP — same two credentials meeting-watch.yml uses.
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_RECIPIENTS_EXTRA: ${{ secrets.ALERT_RECIPIENTS_EXTRA }}
        run: python scripts/oneoff_meeting_watch_keyword_backfill.py
