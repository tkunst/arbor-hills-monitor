name: findings-feed

# Regenerates the public "Public Records" feed (site/public-records/) from the case-file
# Sheet's New Documents + Historical Documents tabs and commits any REAL
# change back to main (a run where nothing new was filed makes no commit --
# see the diff-quiet guard below). pages.yml redeploys on that commit via a
# workflow_run trigger, since a GITHUB_TOKEN push doesn't retrigger its own
# `push` trigger (see pages.yml's comment) -- no incremental append, no
# separate state to get out of sync; a missed run just means the feed is
# stale by one day, never wrong. Read-only against the Sheet: only
# `values().get` calls, see findings_feed.py / scripts/gen_findings_feed.py.
on:
  schedule:
    - cron: "30 11 * * *"   # ~30min after daily.yml's 6am ET / 11am UTC watcher run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: findings-feed
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Regenerate the Findings feed
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scripts/gen_findings_feed.py
      - name: Commit and push if the feed changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public-records
          # Every page's footer carries a fresh "Generated <timestamp>" line on
          # every run (see findings_feed.render_page), so a bare
          # `git diff --cached --quiet` would NEVER be quiet -- it would commit
          # + push all 35 pages every single day even when the document set is
          # byte-identical. -I ignores a changed line that matches this regex,
          # so only a REAL content change (a new/changed document) counts.
          if git diff --cached --quiet -I'^<p>Generated .* UTC from the monitor'; then
            echo "No change to the Public Records feed (beyond the regeneration timestamp)."
            git restore --staged --worktree site/public-records
          else
            git commit -m "chore(findings): regenerate the public Findings feed"
            git push
          fi
