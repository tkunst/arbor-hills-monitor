name: backfill

# Processes the existing ~754 N2688 documents in batches of 50, one batch per
# nightly run, resuming from the Sheet's _state tab. Self-terminating: once
# _state shows every doc processed, the run logs "Backfill complete" and exits
# 0 — it just becomes a no-op. No human action needed to shut it off.
on:
  # SCHEDULE DISABLED 2026-07-07 — historical backfill is complete (0 remaining).
  # The daily cron was RACING the watcher: backfill ran 4h earlier (2am vs the
  # watcher's 6am ET), so it claimed each new nSITE filing and processed it
  # WITHOUT sending email (backfill has no alert path). The watcher then saw
  # "0 new" and no alert ever fired — e.g. the 2026-06-26 SEM inspection package
  # (2 evidence/urgent docs) landed silently in the Sheet. With the cron off, the
  # watcher (daily.yml) is the sole processor of new filings and its urgent/digest
  # emails work again. Kept as workflow_dispatch for manual RETRY_POISONED runs and
  # future new-facility backfills. See handoffs/2026-07-07-arbor-hills-no-email-diagnosis.md
  # schedule:
  #   - cron: "0 7 * * *"   # 2am ET (7am UTC). DST drift is fine for a backfill.
  workflow_dispatch:       # allow manual runs while iterating
    inputs:
      retry_poisoned:
        description: "Re-attempt poisoned docs (>=3 failures) this run — use after raising classification_max_tokens"
        type: boolean
        default: false
      retry_doc_ids:
        description: "Comma-separated nSITE doc_ids to retry regardless of skipped/poisoned status (ADR 011 one-time backfills)"
        type: string
        default: ""
      force_reprocess_doc_ids:
        description: "Comma-separated doc_ids to RE-PROCESS even if already processed (purges their old rows first). E.g. re-extract WOI reports via woi_router — ADR 005."
        type: string
        default: ""
      force_reprocess_apply:
        description: "Actually purge + re-extract the force_reprocess_doc_ids. Leave OFF for a dry-run preview (mutates nothing) first."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill          # never overlap two backfill runs
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # a 50-doc batch is ~20 min; well under the 6h cap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system OCR tooling
        # continue-on-error (found by the advisor, 2026-10-13): a flaky apt
        # mirror must never fail this whole job -- ensure_searchable()/
        # ocr_in_place() already fail open when ocrmypdf is missing, and
        # ridgewood.yml's H2S safety-alert logic specifically must not
        # depend on this step succeeding (ADR 016).
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ocrmypdf
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Run one backfill batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GDRIVE_FOLDER_ID is vestigial since ADR 006 (state + links no longer
          # use a Drive folder); left unset. State lives in the Sheet's tabs.
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          # Private, service-account-only Sheet: the Parser Review Flags tab
          # (review_flags.py) lives there, never on the public case file. If
          # unset, review flags are counted in the log and not written.
          GSHEET_ID_PRIVATE: ${{ secrets.GSHEET_ID_PRIVATE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # backfill.py never sends the coalition alerts; its only send path is
          # the OWNER-only email in owner_notices.py (unreadable enforcement
          # notice / above-ceiling temperature), off unless
          # owner_weekly.enforcement_alert_enabled. Kept complete so that path
          # doesn't silently omit SMTP_FROM the way
          # route-hand-curated.yml did on its first run (2026-09-20, "Bad
          # sender address syntax" -- SMTP_FROM missing, fell back to
          # SMTP_USER, which isn't a valid From address at this relay).
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Owner-only same-day alert for an unreadable enforcement notice
          # (owner_notices.py, gated on owner_weekly.enforcement_alert_enabled):
          # the owner addresses, and the suppression list send_email honors.
          MONITOR_OWNER_EMAILS: ${{ secrets.MONITOR_OWNER_EMAILS }}
          UNSUBSCRIBED_EMAILS: ${{ secrets.UNSUBSCRIBED_EMAILS }}
          # Default false; set true via "Run workflow" to re-attempt poison docs.
          RETRY_POISONED: ${{ inputs.retry_poisoned }}
          # Default empty; set via "Run workflow" for a one-time targeted retry.
          RETRY_DOC_IDS: ${{ inputs.retry_doc_ids }}
          # Re-process already-processed docs (purges their old rows first). Both
          # are workflow_dispatch inputs (operator-supplied, not untrusted event
          # data) and are read by Python via os.environ — never shell-evaluated.
          # APPLY defaults false, so a bare doc-id list is a safe dry-run preview.
          FORCE_REPROCESS_DOC_IDS: ${{ inputs.force_reprocess_doc_ids }}
          FORCE_REPROCESS_APPLY: ${{ inputs.force_reprocess_apply }}
          # ADR 007 addendum: backfill now mirrors each newly-processed doc to
          # Drive inline (archiver.mirror_one_now()), best-effort, same as
          # daily.yml's watcher step. Unset = quiet no-op, falls back to the
          # nSITE link exactly as before this was added.
          GOAUTH_CLIENT_ID: ${{ secrets.GOAUTH_CLIENT_ID_KUNST }}
          GOAUTH_CLIENT_SECRET: ${{ secrets.GOAUTH_CLIENT_SECRET_KUNST }}
          GOAUTH_REFRESH_TOKEN: ${{ secrets.GOAUTH_REFRESH_TOKEN_KUNST }}
          GOAUTH_ARCHIVE_FOLDER_ID: ${{ secrets.GOAUTH_ARCHIVE_FOLDER_ID }}
        run: python backfill.py
