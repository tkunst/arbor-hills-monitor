name: govqa-watch

# EGLE GovQA public FOIA archive watch (Stream U, ADR 059): daily, sweep the archive
# for requests about Arbor Hills (one keyword per headless-browser search, newest
# first), re-check open/watched requests by number, alert on a new matching request
# or a status change. Rows go ONLY to the PRIVATE Sheet (GSHEET_ID_PRIVATE) — this
# workflow deliberately does NOT receive the public GSHEET_ID: request text and
# attachment names can name residents and street addresses.
#
# Safe to leave scheduled from day one: govqa.enabled gates the run —
# govqa_watcher._should_run() makes every run a quiet no-op (exit 0) while it is
# false (ships disabled), and the Playwright browser is installed ONLY when the
# stream is enabled or a manual probe is requested, so the disabled job costs a
# few seconds. `probe: true` (manual dispatch) runs one real lookup and one real
# keyword search regardless of the flag and writes nothing.
on:
  schedule:
    - cron: "0 18 * * *"    # 6pm UTC (2pm EDT / 1pm EST — DST drift of +/-1h is acceptable); after ride-watch / ride-docs-watch.
  workflow_dispatch:
    inputs:
      probe:
        description: "Fetch-path diagnostic only (no Sheet/Drive/email writes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: govqa-watch
  cancel-in-progress: false

jobs:
  govqa-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Is the stream enabled?
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from config_loader import load_config
          print("enabled=" + str(bool((load_config().get("govqa") or {}).get("enabled"))).lower())
          PY
      - name: Install the headless browser (only when enabled or probing)
        if: steps.gate.outputs.enabled == 'true' || inputs.probe == true
        run: |
          pip install playwright==1.58.0
          playwright install --with-deps chromium
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Watch the EGLE FOIA archive
        env:
          PROBE: ${{ inputs.probe }}
          # PRIVATE Sheet only. GSHEET_ID (public) is intentionally NOT passed.
          GSHEET_ID_PRIVATE: ${{ secrets.GSHEET_ID_PRIVATE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Optional private staging (OAuth identity + PRIVATE folder) and the CSV drop
          # folder (shared with the service account). The staging folder MUST be private
          # and its own — the watcher refuses to stage if it equals another GOAUTH_*_FOLDER_ID.
          GOAUTH_CLIENT_ID: ${{ secrets.GOAUTH_CLIENT_ID_KUNST }}
          GOAUTH_CLIENT_SECRET: ${{ secrets.GOAUTH_CLIENT_SECRET_KUNST }}
          GOAUTH_REFRESH_TOKEN: ${{ secrets.GOAUTH_REFRESH_TOKEN_KUNST }}
          GOAUTH_GOVQA_STAGING_FOLDER_ID: ${{ secrets.GOAUTH_GOVQA_STAGING_FOLDER_ID }}
          GOAUTH_GOVQA_CSV_FOLDER_ID: ${{ secrets.GOAUTH_GOVQA_CSV_FOLDER_ID }}
          # The OTHER mirrors' folder ids are passed ONLY so the watcher can enforce that
          # guard (and, optionally, read them as "already held" MD5 sources).
          GOAUTH_ARCHIVE_FOLDER_ID: ${{ secrets.GOAUTH_ARCHIVE_FOLDER_ID }}
          GOAUTH_BOC_FOLDER_ID: ${{ secrets.GOAUTH_BOC_FOLDER_ID }}
          GOAUTH_DPW_FOLDER_ID: ${{ secrets.GOAUTH_DPW_FOLDER_ID }}
          GOAUTH_GFL_AIR_FOLDER_ID: ${{ secrets.GOAUTH_GFL_AIR_FOLDER_ID }}
          GOAUTH_MMPC_FOLDER_ID: ${{ secrets.GOAUTH_MMPC_FOLDER_ID }}
          GOAUTH_RIDGEWOOD_FOLDER_ID: ${{ secrets.GOAUTH_RIDGEWOOD_FOLDER_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}          # the (vestigial) public PDF archive folder — same guard
        run: |
          if [ "$PROBE" = "true" ]; then
            python govqa_watcher.py --probe
          else
            python govqa_watcher.py
          fi
