name: gfl-feed-snapshot

# ADR 063: monthly FULL snapshot of GFL's public perimeter-air feed (every row of
# every layer, verbatim) to the app-only GFL Air Exhibit Drive folder, diffed
# against the previous snapshot; past readings deleted or edited upstream email the
# owner list only. A quiet no-op until gfl_feed_snapshot.enabled is true. Exits 1
# (GitHub failure email) if the pull is incomplete or the upload/compare fails.
on:
  schedule:
    - cron: "17 14 2 * *"   # 2nd of each month, ~10:17am ET (off the hour: rows land on the hour).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gfl-feed-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Snapshot the GFL perimeter feed
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MONITOR_OWNER_EMAILS: ${{ secrets.MONITOR_OWNER_EMAILS }}
          UNSUBSCRIBED_EMAILS: ${{ secrets.UNSUBSCRIBED_EMAILS }}
          # Same kunst.trisha OAuth identity + folder as the daily capture (gfl-air.yml).
          GOAUTH_CLIENT_ID: ${{ secrets.GOAUTH_CLIENT_ID_KUNST }}
          GOAUTH_CLIENT_SECRET: ${{ secrets.GOAUTH_CLIENT_SECRET_KUNST }}
          GOAUTH_REFRESH_TOKEN: ${{ secrets.GOAUTH_REFRESH_TOKEN_KUNST }}
          GOAUTH_GFL_AIR_FOLDER_ID: ${{ secrets.GOAUTH_GFL_AIR_FOLDER_ID }}
        run: python gfl_feed_snapshot.py
