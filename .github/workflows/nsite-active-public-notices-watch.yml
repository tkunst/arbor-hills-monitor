name: nsite-active-public-notices-watch

# nSITE Active Public Notices watch (Stream Q, ADR 032): daily watch on EGLE's
# nSITE Active Public Notices profile — the formal comment-window
# announcements (permit renewals, draft permits, hearings) — for every site in
# config.yml's `nsite_sites` registry that has an `nsite_public_notices.tiers`
# entry. Emails an alert on a brand-new notice or an existing notice's detail
# advancing, vs the last snapshot in the "Public Notices Watch" tab; the first
# sighting of each site baselines silently.
#
# Ships nsite_public_notices.enabled: FALSE and STAYS FALSE pending a human
# decision (not just "until reviewed" like a routine new poller): live
# sampling found this profile's only real record, on two separate dates, was
# itself a ROP renewal notice the monitor's separate ROP watch (Stream H)
# already tracks — see docs/decisions/032-nsite-active-public-notices-watch.md
# for the three-option writeup this ships holding open. So this job runs on
# schedule but is a deliberate no-op until that decision is made AND the flag
# is flipped. No Anthropic (a deterministic extractor, not the Claude
# classifier) and no Drive/OAuth (the deliverable is the alert + the durable
# Sheet row, same scope call as every sibling nSITE watch). 7pm ET continues
# the sequential slotting after pfas(7am)/rop(10am)/mmd(11am)/ride(12pm)/
# submissions(1pm)/violations(2pm)/compliance-actions(3pm)/evaluations(4pm)/
# permits(5pm)/complaints(6pm); state is the "Public Notices Watch" tab, NOT
# _meta, so it never races the other jobs.
on:
  schedule:
    - cron: "0 0 * * *"    # 7pm ET (12am UTC). DST drift of +/-1h is acceptable.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nsite-active-public-notices-watch
  cancel-in-progress: false

jobs:
  nsite-active-public-notices-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Watch nSITE Active Public Notices for changes
        env:
          # Sheets I/O uses the service account; the change alert uses SMTP.
          # No Anthropic (nothing to classify) and no OAuth (no Drive mirror).
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_RECIPIENTS_EXTRA: ${{ secrets.ALERT_RECIPIENTS_EXTRA }}
        run: python nsite_public_notices_watcher.py
