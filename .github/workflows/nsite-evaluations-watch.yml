name: nsite-evaluations-watch

# nSITE Evaluations watch (Stream N, ADR 029): daily watch on EGLE's nSITE
# Evaluations profile — the underlying inspection record a violation or
# compliance action often stems from — for every site in config.yml's
# `nsite_sites` registry that has an `nsite_evaluations.tiers` entry. Emails an
# alert on a brand-new evaluation (a new inspection) or an existing
# evaluation's detail advancing, vs the last snapshot in the "Evaluations
# Watch" tab; the first sighting of each site baselines silently.
#
# Ships nsite_evaluations.enabled: FALSE — a brand-new poller against a live
# external system, built unattended (overnight-coder Step 3), so this job runs
# on schedule but is a deliberate no-op until a human flips the flag. No
# Anthropic (a deterministic extractor, not the Claude classifier) and no
# Drive/OAuth (the deliverable is the alert + the durable Sheet row, same scope
# call as rop/mmd/ride/submissions/violations/compliance-actions). 4pm ET
# continues the sequential slotting after pfas(7am)/rop(10am)/mmd(11am)/
# ride(12pm)/submissions(1pm)/violations(2pm)/compliance-actions(3pm); state is
# the "Evaluations Watch" tab, NOT _meta, so it never races the other jobs.
on:
  schedule:
    - cron: "0 21 * * *"    # 4pm ET (9pm UTC). DST drift of +/-1h is acceptable.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nsite-evaluations-watch
  cancel-in-progress: false

jobs:
  nsite-evaluations-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account key to a temp file
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/gdrive-sa-key.json"
          echo "GDRIVE_SA_KEY=$RUNNER_TEMP/gdrive-sa-key.json" >> "$GITHUB_ENV"
      - name: Watch nSITE Evaluations for changes
        env:
          # Sheets I/O uses the service account; the change alert uses SMTP.
          # No Anthropic (nothing to classify) and no OAuth (no Drive mirror).
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_RECIPIENTS_EXTRA: ${{ secrets.ALERT_RECIPIENTS_EXTRA }}
        run: python nsite_evaluations_watcher.py
