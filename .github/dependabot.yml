version: 2

# Dependabot SECURITY updates (vulnerability alerts -> auto-opened PRs) are a
# separate GitHub feature, already enabled on this repo, and are NOT affected
# by anything in this file -- not the schedule, not `groups`, not `ignore`.
# A security PR for any package (including the two `ignore`d below) opens
# immediately, regardless of this config. This file only governs routine
# VERSION updates.
#
# Auto-merge policy 2A (Trisha, 2026-10-14): patch/minor merge themselves once
# tests pass; majors wait for review. See
# .github/workflows/dependabot-auto-merge.yml and
# .github/workflows/dependabot-label.yml for the enforcement side of this.

updates:
  # --- pip (requirements.in -> hashed requirements.txt via pip-compile) ---
  # Verified Dependabot has first-class pip-compile support (GitHub's own
  # "Dependabot supported ecosystems and repositories" doc lists "pip-compile"
  # as its own entry, distinct from plain "pip", supporting both version
  # updates and security updates) and that it recognizes a pip-compile output
  # file by its own header comment (this repo's requirements.txt starts with
  # "# This file is autogenerated by pip-compile ... --generate-hashes
  # --output-file=requirements.txt") and reruns that same command -- including
  # --generate-hashes -- when it bumps a pin, rather than hand-editing the
  # version line. No live spike was run (that would require a real Dependabot
  # pass against this repo or a fork, which this session can't trigger without
  # changing repo settings); this is a documentation-based verification. The
  # PR description names the exact docs checked. Confirm once by clicking
  # "Check for updates" on this file from the repo's Insights > Dependency
  # graph > Dependabot tab after merge, per the handoff's verification step.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      # One grouped PR per week for everything patch/minor; a major bump for
      # any package is deliberately left OUT of this group (no `major` in
      # update-types) so it opens as its own separate, ungrouped PR -- that's
      # what gives majors a distinct PR to label `needs-review` and route to
      # Trisha, instead of a major silently riding along inside the weekly
      # patch/minor group.
      pip-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # anthropic (Claude API) and google-api-python-client (Drive/Sheets):
      # both have their real SDK call path fully monkeypatched out of the
      # hermetic test suite --
      #   - tests/test_parser.py monkeypatches `_classify_with_claude`
      #     itself, the one function that calls `anthropic.Anthropic()`
      #     (egle_doc_parser.py), so no test ever executes a real line of the
      #     anthropic SDK.
      #   - tests/test_archive.py, tests/test_sheet_writer.py,
      #     tests/test_backfill_mirror_ocr.py, tests/test_gfl_air.py, etc.
      #     replace `drive_client.sheets_service()` / `drive_service()`
      #     wholesale with hand-written Fake* stand-ins, so no test ever
      #     executes a real line of googleapiclient either.
      # A green `pytest` run on a patch/minor bump of either package therefore
      # proves the fake stand-in still matches the interface it mocks --
      # nothing about whether the real network/SDK behavior changed. This is
      # exactly the "mocked-green is never enough" trap CLAUDE.md's Forbidden
      # Patterns section calls out for a different case (hardware self-report
      # vs data QA); the same structural gap applies here. No git history
      # evidence was found of a past anthropic/google-api-python-client minor
      # release actually breaking this repo (`git log --all --grep` found
      # nothing), so this is a structural precaution, not a response to a
      # known incident -- forcing every bump of these two to major-only (i.e.
      # to a normal, separate PR Trisha reviews) regardless of semver level.
      # PyMuPDF is NOT included here: its real `fitz.open()` / text-extraction
      # calls run for real against synthetic PDFs built with the same library
      # in most tests (e.g. tests/test_parser.py's fixtures), so a patch/minor
      # regression there has genuine hermetic coverage.
      - dependency-name: "anthropic"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "google-api-python-client"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  # --- github-actions (workflow actions, incl. SHA-pinned third-party ones) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Dependabot updates a SHA-pinned action (e.g.
      # `DavidAnson/markdownlint-cli2-action@ded1f94... # v23`) by bumping the
      # pinned SHA and the trailing `# vX` version comment together -- it
      # already understands this repo's pin-with-comment convention, no
      # config needed for that part.
      github-actions-all:
        patterns:
          - "*"
