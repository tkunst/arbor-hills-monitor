version: 2

# Dependabot SECURITY updates (vulnerability alerts -> auto-opened PRs) are a
# separate GitHub feature, already enabled on this repo, and are NOT affected
# by anything in this file -- not the schedule, not `groups`. A security PR
# for any package opens immediately, regardless of this config. This file
# only governs routine VERSION updates.
#
# Auto-merge policy 2A (Trisha, 2026-10-14): patch/minor merge themselves once
# tests pass; majors wait for review. See
# .github/workflows/dependabot-auto-merge.yml and
# .github/workflows/dependabot-label.yml for the enforcement side of this.

updates:
  # --- pip (requirements.in -> hashed requirements.txt via pip-compile) ---
  # Verified Dependabot has first-class pip-compile support: GitHub's own
  # "Dependabot supported ecosystems and repositories" doc lists "pip-compile"
  # as its own entry, distinct from plain "pip" (version 7.5.3), supporting
  # both version updates and security updates. The exact mechanics of hash
  # regeneration on a bump (whether it reruns --generate-hashes from this
  # file's own header) are NOT confirmed against an official GitHub doc --
  # that detail is sourced from dependabot-core's own issue tracker, not
  # docs.github.com, so treat it as plausible, not confirmed, until the first
  # real run. The actual backstop is independent of that claim either way:
  # every workflow installs with `pip install --require-hashes -r
  # requirements.txt`, so a PR with a bad/stale/unregenerated hash fails
  # `tests` loudly rather than silently installing an unverified package. No
  # live spike was run (that would require a real Dependabot pass against
  # this repo or a fork, which this session can't trigger without changing
  # repo settings); confirm once by clicking "Check for updates" on this file
  # from the repo's Insights > Dependency graph > Dependabot tab after merge.
  # A root `.python-version` file (added alongside this config) pins
  # Dependabot's own pip-compile run to 3.12, matching every workflow's
  # `python-version: "3.12"` -- dependabot-core#14137 documents Dependabot's
  # pip-compile ignoring the Python version in the lockfile's own header
  # without one, which could otherwise compile against a different Python
  # than CI tests against.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      # One grouped PR per week for everything patch/minor; a major bump for
      # any package is deliberately left OUT of this group (no `major` in
      # update-types) so it opens as its own separate, ungrouped PR -- that's
      # what gives majors a distinct PR to label `needs-review` and route to
      # Trisha, instead of a major silently riding along inside the weekly
      # patch/minor group.
      pip-patch-minor:
        patterns:
          - "*"
        exclude-patterns:
          # anthropic (Claude API) and google-api-python-client (Drive/
          # Sheets): both have their real SDK call path fully monkeypatched
          # out of the hermetic test suite --
          #   - tests/test_parser.py monkeypatches `_classify_with_claude`
          #     itself, the one function that calls `anthropic.Anthropic()`
          #     (egle_doc_parser.py), so no test ever executes a real line of
          #     the anthropic SDK.
          #   - tests/test_archive.py, tests/test_sheet_writer.py,
          #     tests/test_backfill_mirror_ocr.py, tests/test_gfl_air.py, etc.
          #     replace `drive_client.sheets_service()` / `drive_service()`
          #     wholesale with hand-written Fake* stand-ins, so no test ever
          #     executes a real line of googleapiclient either.
          # A green `pytest` on a patch/minor bump of either therefore proves
          # the fake stand-in still matches the interface it mocks -- nothing
          # about whether the real network/SDK behavior changed (the
          # "mocked-green is never enough" gap this repo's own
          # docs/overnight-coder.md Step 3 calls out for new/live sources;
          # CLAUDE.md's Forbidden Patterns flags an analogous-shaped gap for
          # hardware self-report vs. data QA, a different case but the same
          # structural blind spot). No git-history evidence was found of a
          # past anthropic/google-api-python-client minor release actually
          # breaking this repo (`git log --all --grep` came back empty) --
          # this is a structural precaution, not a response to a known
          # incident. `exclude-patterns` (NOT `ignore`) is deliberate: these
          # two must still get a routine patch/minor PR opened every time
          # (so Trisha sees every bump promptly) -- they're just excluded
          # from this GROUP so they never ride along inside the weekly
          # grouped PR; dependabot-auto-merge.yml's classify step
          # independently forces `needs-review` for either package by name,
          # regardless of what update-type the commit message reports, so
          # the exclusion here and the force-review there are two
          # independent guards against the same mistake. PyMuPDF is NOT
          # excluded: its real `fitz.open()` / text-extraction calls run for
          # real against synthetic PDFs built with the same library in most
          # tests, so patch/minor regressions there have genuine hermetic
          # coverage.
          - "anthropic"
          - "google-api-python-client"
        update-types:
          - "patch"
          - "minor"

  # --- github-actions (workflow actions, incl. SHA-pinned third-party ones) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Dependabot updates a SHA-pinned action (e.g.
      # `DavidAnson/markdownlint-cli2-action@ded1f94... # v23`) by bumping the
      # pinned SHA and the trailing `# vX` version comment together -- it
      # already understands this repo's pin-with-comment convention, no
      # config needed for that part.
      #
      # Deliberately no `update-types` restriction here, unlike the pip
      # group above -- a monthly batch can freely mix majors with patch/minor
      # action bumps. This is safe only because dependabot-auto-merge.yml's
      # classify step routes EVERY github-actions-ecosystem PR to
      # needs-review unconditionally, by branch name
      # (`dependabot/github_actions/...`), before it ever looks at
      # update-type -- GITHUB_TOKEN can never be granted the `workflows`
      # permission a push to .github/workflows/ requires, so none of this
      # ecosystem could auto-merge regardless of how it's grouped. If that
      # routing is ever removed, this group needs an update-types split like
      # pip's, or a single major riding along would silently withhold an
      # entire otherwise-safe grouped PR from auto-merge (not unsafe, just
      # surprising) -- or worse, if the branch-name routing were removed
      # without a replacement, nothing would catch the GITHUB_TOKEN
      # failure at all.
      github-actions-all:
        patterns:
          - "*"
