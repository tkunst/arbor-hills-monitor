#
# ACTIVATION:
#   1. create the 2 destination folders (scripts/create_oauth_folder.py, or the
#      `create-oauth-folder` workflow, with `parent_folder_id` set to Trisha's
#      given parent so they land directly in the right place),
#   2. set GOAUTH_DPW_FOLDER_ID / GOAUTH_BOC_FOLDER_ID as GitHub secrets
#      (the shared GOAUTH_CLIENT_ID/SECRET/REFRESH_TOKEN already exist — same
#      OAuth account Mirror D uses),
#   3. set `enabled: true` here and commit.
# A mirror whose folder secret isn't set yet is skipped, not a hard failure —
# DPW and BOC can be activated independently as each folder gets provisioned.
civicclerk_archive:
  enabled: true                     # activated 2026-09-06 (Trisha) — DPW + BOC folders created fresh under the kunst.trisha _KUNST identity + GOAUTH_DPW/BOC_FOLDER_ID set; workflow creds on _KUNST. See ADR 037.
  mirrors:
