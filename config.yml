# Arbor Hills Document Monitor — non-secret configuration.
# Secrets live in .env / GitHub Secrets, never here. See .env.example.

# --- nSITE / EGLE source ---
# The facilities to track. Each entry is one nSITE facility profile; the monitor
# fetches all of them and tags every document with its facility (the "Facility"
# column in the Sheet). nSITE doc_ids are GLOBALLY UNIQUE across these facilities
# (verified 0 pairwise overlap, 2026-06-15), so they safely share one Sheet and
# one _state tab with no composite key. See docs/decisions/008-multi-facility.md.
#
# ORDER MATTERS for backfill: it concatenates the facilities in THIS order and
# processes the next `backfill_batch_size` unprocessed docs each run, so whatever
# is listed first gets pulled first. The Remediation Area (R5/PFAS) leads so it
# clears first; N2688's ~704 not-yet-processed docs are listed LAST so they don't
# block it (its ~50 already-processed docs are skipped regardless). The watcher
# and archiver are order-independent.
#
# SCOPE (ADR 064, 2026-10-07, Trisha-directed). An entry without `scope` is CORE:
# an Arbor Hills / GFL filing that goes to New/Historical Documents, Evidence,
# Measurements, Compliance Deadlines, the public-records pages, urgent alerts
# and the Sunday digest. `scope: related` is a neighboring or watershed site
# (not a GFL filing): its documents go ONLY to the "Related Documents" tab, and
# never to the digest, urgent alerts, Evidence/Measurements/Deadlines or the
# website. The eight neighbor-development sites added 2026-09-25 (COLDR, TOLL,
# RIDGE, PTEX, LUMB, DTE5M, FMCOM, NTWP) are NOT here at all: they stay in
# `nsite_sites` for the Trisha-only profile watches, but their documents are
# not collected. Any new entry must be classified on purpose; tests pin the set.
facilities:
  - {srn: "RA",    name: "Arbor Hills Remediation Area",  id: "-714792003991405124"}   # Water/RRD — R5/PFAS, process FIRST (740 docs)
  - {srn: "WRD",   name: "GFL-Arbor Hills Landfill-Washtenaw Co", id: "306291952280313698"}   # WRD Land & Water Interface (JPA/wetlands/floodplain/inland lakes) — R1/R5; found 2026-07-24 tracing a missed JPA (ADR 020); 69 never-seen docs, clears safely behind the anti-stampede guard (watcher.max_new_docs_per_run defers to backfill, which never alerts)
