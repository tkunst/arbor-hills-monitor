# --- nSITE Permits watch (Stream O, ADR 030) ---
# Watch on the "Permits" profile — a facility's permit lifecycle (issued ->
# extended -> expiring -> terminated), across EVERY permit type on file (Air
# ROPs, Air Permits to Install, Air Reporting Schedules, NPDES water permits,
# Resources/wetland permits) — a sixth sibling profile to Documents
# (`facilities:`), Submissions, Violations, Compliance Actions, and
# Evaluations above. ONE fetch per site -> ONE item ("prmt:<srn>"); the FIRST
# sighting of each site's permit list baselines silently. Like Evaluations,
# this profile has a genuine unique key (`prmtPrmtNum`, live-verified 9/9 at
# N2688, 4/4 at N1504, 3/3 at P1488, 2/2 at RA, 2/2 at WRD, 1/1 at P1504,
# 1/1 at SANL), so the diff is REF-NUMBER-KEYED: a new prmt_num alerts as a
# brand-new permit; an existing one with a changed field (most importantly
