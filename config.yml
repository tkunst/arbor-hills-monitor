# (`rop:`, ADR 017) through a different mechanism. Confirmed via the API's
# own field-metadata that no program-area or facility-category field exists
# in this profile to filter on, so a clean "just the non-ROP notices" scope
# via a structured field is not available without EGLE adding one.
#
# RESOLVED 2026-08-26 (Trisha-directed): rather than pick pure standalone
# (both real alerts to date would have been redundant with Stream H) or a
# Stream H state-based dedupe (couples two independently-evolving mechanisms
# for uncertain benefit), this watch suppresses its own EMAIL — never the
# durable Sheet row — when a changed notice's text reads as a ROP renewal by
