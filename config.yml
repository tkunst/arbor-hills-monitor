# --- nSITE Compliance Actions watch (Stream M, ADR 028) ---
# Watch on the "Compliance Actions" profile — the formal actions EGLE takes in
# RESPONSE to a violation (Violation Notices, Consent Orders, Consent Judgments),
# the documented OTHER HALF of the enforcement story the Violations watch (Stream
# L) covers. A fourth sibling profile to Documents (`facilities:`), Submissions,
# and Violations above. ONE fetch per site -> ONE item ("ca:<srn>"); the FIRST
# sighting of each site's compliance-action list baselines silently. After that,
# ANY change alerts — a new action appearing, or an existing one's status
# advancing (e.g. a Violation Notice moving Issued -> Closed). NO judgment about
# which status is good or bad: EGLE's vocabulary ("Issued", "Closed", "Entered",
# "Terminated") is a multi-state lifecycle, so this is a trip-wire and a human
# reads what the change means.
#
# `tiers` maps srn -> poll cadence for THIS profile only; every key MUST be a srn
# present in `nsite_sites` above — a typo'd/unknown srn is a config error and
# raises loudly (ADR 022). The tiers below are DELIBERATELY NOT a copy of
# `nsite_violations.tiers`: the 5 non-dormant sites were live-fetched on
# 2026-08-08 and the counts/recency differ. In particular N1504 is DAILY for
# Violations (its violations are open/unresolved) but BIWEEKLY here, because its
# two compliance actions are both CLOSED. See ADR 028 for the full table.
nsite_compliance_actions:
  # ACTIVATED 2026-08-09 (Trisha-directed): the parked workflow was moved into
  # .github/workflows/nsite-compliance-actions-watch.yml and this flag flipped on
  # in the same change — via an SSH push, because the `workflow` OAuth scope is
  # deliberately not kept on the build machine (the same path PR #36 used to arm
  # Stream L). The first enabled run baselines every due site silently — no alert
  # flood, even at N2688's 39 records — and alerts (Trisha-only to start) begin
  # only on the next run that finds an actual change. See ADR 028.
  enabled: true
  # Recipient override: Trisha only to start (the Meeting Watch / MMD / RIDE /
  # Submissions / Violations precedent for a brand-new alert stream). Delete/
  # comment this block to send to the full alert_recipients list once the alert
  # copy has been seen in the wild.
  recipients:
    - arbor-hills@trishakunst.com
  # ROLLBACK LEVER, inherited from ADR 023 for parity — but UNLIKE Violations
  # there is no known volatile field to point it at (all six CA fields are
  # controlled vocabularies or a reference number, none free text). It ships
  # excluding nothing; uncomment a field only if activation shows it churning.
  # Changing this list changes the hash basis, so it fires exactly ONE
  # re-baseline row per site, labelled a configuration change, not an EGLE change.
  # exclude_fields:
  #   - category
  # Max characters written to the Snapshot JSON cell before the watch degrades
  # to a digest-only payload. A Sheets cell hard-caps at 50,000; the largest CA
  # site (N2688, 39 records) serializes to ~4,800 in the run-length counted form,
