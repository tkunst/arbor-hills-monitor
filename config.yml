# --- nSITE Submissions watch (Stream K, ADR 020; tiered cadence ADR 021; site identity moved to nsite_sites above, ADR 022) ---
# Watch on the "Submissions" profile (application / service-request intake: a
# stable Submission Reference Number, form name, program area, status) — a
# DIFFERENT profile than Documents (`facilities:` above). Built 2026-07-24
# after a JPA (EGLE/USACE Joint Permit Application — wetlands/floodplain/inland
# lakes & streams/dams) for the WRD Land & Water Interface site reached Trisha
# only via her personal MiEnviro email subscription; it never appeared in the
# Documents profile the monitor already polled. ONE fetch per site -> ONE item
# ("subm:<srn>"); the FIRST sighting of each site's Submissions list baselines
# silently. After that, a brand-new Submission Reference Number alerts as "NEW
# SUBMISSION RECEIVED"; an existing one's status/detail changing alerts
# separately (the ref-number-keyed diff — see nsite_submissions_watcher.py).
#
# `tiers` maps srn -> poll cadence for THIS profile only; every key MUST be a
# srn present in `nsite_sites` above — a typo'd/unknown srn here is a config
# error and raises loudly (see ADR 022), rather than silently going unwatched.
# It covers all 19 of Trisha's MiEnviro email subscriptions, most of which
# have no meaningful Documents history and were never added to `facilities:`.
# Each site's tier controls how often nsite_submissions_watcher.py actually
# fetches+diffs it (`_is_due`, hash-staggered per site, fires across a 3-day
# window per period so one missed/failed run doesn't blank a quarterly site
# out for a full quarter):
