# --- WOI (Wells of Interest) auto-routing (ADR 005 integration, added 2026-07-13) ---
# The semi-annual WOI Status Reports (the two are 181 and 323 pp of per-well
# gas-extraction tables) are routed to the exhaustive woi_table_parser instead of
# the generic keyword-windowing above. Windowing captures <5% of the ~14,000
# readings AND can miss a measured >=145F exceedance entirely — a hot well buried
# on a page with no signal keyword produces no measurement, so is_urgent never
# fires. Detection is CONTENT-based (the Attachment-1 "Gas Extraction Report"
# header + page count), NOT the nSITE filename: the real reports are filed under
# generic names ("nForm Document"/"Site"), so a name signal would never fire.
# See woi_router.py and docs/decisions/005.
#
# This is a LIVE-PATH fix that ships ON. `auto_route` is a ROLLBACK LEVER, not a
# new-source enable gate: flip it to false and the monitor falls back to
# windowing if the detector or the volume ever misbehaves.
woi:
  auto_route: true

# --- Named single-well temperature trip-wires (ADR 058, well_watch.py) ---
# Fires a dedicated email naming the well when a newly processed WOI-format
# filing shows it at/above threshold_f. `pattern` matches the well NUMBER across
# redrills/prefix/zero-pad drift; `since` ignores re-printed history rows.
well_watch:
  recipients:
    - arbor-hills@trishakunst.com        # Trisha only
  wells:
    - label: "AHW263R5 (Cell 1D, north; SSO-tagged)"
      pattern: '^AHW{1,2}0*263R\d*$'
      threshold_f: 145
      since: "2026-05-01"
      note: >-
        145F is the federal MACT Subpart AAAA wellhead limit. AHW263R5 got a
        170F HOV on 7/23/2025 (letter states no end date) but is NOT in the
        4/7/2026 16-well HOV renewal (through 5/1/2028), so whether a waiver
        still covers it is unconfirmed. Through 6/30/2026 it held at
        142.1-144.2F.

# --- Backfill ---
backfill_batch_size: 50          # docs per nightly run

# --- Archive (optional durable PDF mirror — ADR 007) ---
# The archiver mirrors processed PDFs into a Drive folder Trisha owns (OAuth),
# as insurance against nSITE link rot. No Claude/OCR, just download + upload, so
# a larger batch than the backfill is fine. folder_name is used ONCE by
# scripts/oauth_setup.py when it creates the folder; the archiver then uses the
# GOAUTH_ARCHIVE_FOLDER_ID secret.
archive:
  batch_size: 100
  folder_name: "Arbor Hills Case File Mirror"

# --- Data lifecycle: snapshot -> immutable Drive exporter (ADR 072) ---
# OFF BY DEFAULT. Cross-cutting (not inside any one watcher's block): when
# enabled, rop_watcher / mmd_watcher / nsite_submissions_watcher / pfas_watcher
# each upload the raw snapshot payload they are about to append to their Sheet
# tab as an immutable file in ONE shared app-only Drive folder (secret
# GOAUTH_SNAPSHOT_FOLDER_ID), BEFORE the Sheet row is written — the Tier-1
# copy docs/data-lifecycle-architecture.md asks for. Best-effort: a failed or
# unconfigured upload never blocks the row or the alert. See snapshot_exporter.py.
#
# ACTIVATION (Trisha's; mirrors ADR 026's three steps):
#   1. create the app-only folder — run the `create-oauth-folder` workflow
#      (identity `kunst`, e.g. FOLDER_NAME "Arbor Hills Watch Snapshots"),
#   2. add its id as the GOAUTH_SNAPSHOT_FOLDER_ID repo secret (the four
#      workflows already pass it through),
#   3. set enabled: true here and commit.
# Until enabled: true is on main, the four watchers behave exactly as before.
data_lifecycle:
  snapshot_export:
    enabled: true   # activated 2026-10-23 (Trisha); GOAUTH_SNAPSHOT_FOLDER_ID set

# --- Watcher (daily) ---
# The daily watcher handles INCREMENTAL new filings only (normal volume is 0-5).
# If it ever sees more unprocessed docs than this, the historical backlog is not
# cleared yet: it DEFERS to the backfill job (processes no docs this run, still
# runs digest housekeeping) rather than stampeding hundreds of historical
# docs into the live feed and firing urgent alerts on years-old exceedances. The
# daily schedule should stay disabled until backfill logs "Backfill complete"
# anyway (see README); this cap is the belt-and-suspenders backstop.
# Over the cap (stall-hardening part (c), 2026-10-23): only an established
# facility's RECENT filings (filed within live_filing_window_days, from a
# facility with at least one processed/skipped document on record) are still
# processed live, and only when they alone fit under the cap; everything else
# — a facility just added to `facilities:`, or the historical remainder of one
# whose backfill has only partly drained — is the backlog and defers as
# before. So a new facility can't freeze live monitoring of every other one
# (the 2026-07-24 stall), and while the backlog is over the cap a
# half-backfilled facility can't stampede years-old filings into the live feed
# either. UNDER the cap nothing is filtered (as before): the last <= 25
# historical documents of a manual backfill are processed live by the next
# watcher run, alerts included — finish a facility's backfill in one sitting.
watcher:
  max_new_docs_per_run: 25
  live_filing_window_days: 30
  # LIVENESS / silent-stall guard (stall-hardening, 2026-10-23; the 2026-08-02
  # digest-recovery lesson). Two signals, one owner-only health notice each,
  # at most once per episode (doc_pipeline_liveness.py; state in
  # _meta.doc_pipeline_health). 0 disables a signal.
  #   max_consecutive_deferrals — daily runs IN A ROW that deferred unprocessed
  #     documents to backfill under the cap above. backfill.yml's schedule is
  #     INTENTIONALLY off (it raced the watcher, 2026-07-07), so a backlog only
  #     drains when backfill is started by hand (workflow_dispatch; one or two
  #     batches of 50 for a new facility). 3 = "the third straight morning the
  #     backlog is still there": nobody has drained it yet. Expect this notice
  #     ~3 days after every new facility is added unless backfill is run.
  #   max_stale_days — calendar days since the watcher last made progress on
  #     its queue (processed a document, struck a genuinely unprocessable one,
  #     or had nothing unprocessed). A quiet week with no new filings does NOT
  #     count as stale; three daily runs that each saw unprocessed documents
  #     and got through none of them (every one deferred, or every one a
  #     transient failure — an outage or a revoked/throttled key) does. 3 keeps
  #     the same order of magnitude as gfl_air.max_stale_days.
  max_consecutive_deferrals: 3
  max_stale_days: 3

# --- WDS (Stream C — EGLE Waste Data System, Part 115 solid waste) ---
# OFF BY DEFAULT. WDS is the solid-waste system of record for the landfill
# (site 475946) — a different portal from nSITE (Air, the `facilities` feed
# above). When enabled, the daily watcher polls the collections below, diffs
# against stored state (Sheet _meta `wds_seen`), and alerts on NEW/CHANGED
# records using wds_watcher's OWN classifier. See docs/decisions/009-wds-stream-c.md.
#
# ACTIVATION — all three steps are Trisha's call (see the Stream C PR):
#   1. review + merge the stream-c-wds branch to main,
#   2. (optional) run `python scripts/seed_wds_state.py` ONCE to baseline — if you
#      skip it, the FIRST enabled run self-baselines silently (records all current
#      rows, alerts on none), so enabling is safe either way,
#   3. set `enabled: true` here and commit.
# Until `enabled: true` is on main, the watcher's WDS block is a no-op.
wds:
  enabled: true
  site_id: "475946"                 # Arbor Hills Landfill, Inc. (MIK114185416)
  # Collections to poll + their alert tiers (wds_watcher classifier):
  #   applications       new Construction Permit / -> Issued = URGENT (R1 expansion);
  #                      Operating License = notable
  #   compliance_actions new violation notice / assessed penalty = URGENT (R2);
  #                      PAID/RESOLVED/withdrawn = watch
  #   qmr                Statistical Exceedence = Yes -> notable (R5 groundwater);
  #                      No -> watch
  #   annual             new report = watch; years-remaining < floor -> notable (R1)
  #   evaluations        new inspection = watch
  #   penalties          new assessed penalty = NOTABLE (R2, the $ amount); payment
  #                      backfill = watch. Deliberately notable, NOT urgent — these
  #                      are a sub-grid of the same ComplianceActions page whose
  #                      compliance_actions row already fires URGENT on the parent
  #                      enforcement event; urgent here would double-fire. See ADR 043.
  #   composting_registrations  new registration = notable (R1, the compost parcel
  #                      next to the landfill); status/expiration change = watch
  #   composting_reports new annual compost report-year = watch (R1 refresh)
  # (penalties + the two composting_* collections added 2026-09-13, ADR 043 — the
  # last coverage-matrix gap. To roll their alerting back without a code change,
  # remove them from this list; the code paths stay and just go unpolled. Rule B —
  # silent first-baseline — means their first live run records-all/alerts-none.)
  collections:
    - applications
    - compliance_actions
    - qmr
    - annual
    - evaluations
    - penalties
    - composting_registrations
    - composting_reports
  years_remaining_floor: 3.0        # annual report: below this (yrs) -> notable
  # Anti-stampede: if one run yields more alert events than this, treat it as a
  # first-enable-without-seed or a data anomaly and silently re-baseline instead
  # of blasting the list (mirrors watcher.max_new_docs_per_run).
  max_new_wds_alerts_per_run: 20

# --- MMPC minutes reminder — RETIRED 2026-07-12 (ADR 013) ---
# The old `mmpc:` block (2nd-Wednesday meeting-date math + a "minutes likely
# posted, go check" reminder email, mmpc_watcher.py) was removed once Mirror D
# below made it redundant: Mirror D downloads every published MMPC PDF directly,
# so there is nothing left to remind about. See docs/decisions/013.

# --- MMPC document archive (Mirror D, ADR 010, added 2026-07-10) ---
# Auto-downloads every Agenda/Minutes/Other PDF CivicClerk publishes for the
# MMPC (category_id 72) and uploads it into the SAME Drive folder Trisha
# already hand-populates (MMPC-meeting-minutes/, via GOAUTH_MMPC_FOLDER_ID —
# a separate secret from GOAUTH_ARCHIVE_FOLDER_ID, since this is a different
# destination folder). Dedup is Sheet-derived (MMPC Archived Files tab), not a
# _meta key — see mmpc_archiver.py.
#
# ACTIVATION — same three-step pattern as Stream C (see wds: above):
#   1. review + merge,
#   2. first enabled run just archives everything published so far (no seed
#      script needed — there's no "alert flood" risk here, unlike WDS's
#      classified events, since this only ever writes an index row + uploads
#      a file, never emails),
#   3. set `enabled: true` here and commit.
# Until `enabled: true` is on main, mmpc-archive.yml runs on schedule but
# mmpc_archiver.py's _should_run() gate makes every run a no-op.
mmpc_archive:
  enabled: true                     # activated 2026-07-11 (Trisha) — secret set + merged; see ADR 010
  category_id: 72

# --- CivicClerk DPW + BOC Drive archive (ADR 037, added 2026-09-04) ---
# OFF BY DEFAULT — a new external-write capability (Trisha activates once the
