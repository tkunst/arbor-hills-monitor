  # EGLE re-import, not a live concern the way RA's 299 violations were (ADR 028).
  snapshot_char_budget: 45000
  tiers:
    # --- daily (2) — real CA history AND open/recent enforcement ---
    N2688: daily      # 39 CAs, 2014-12-15..2026-07-15; a VN ISSUED last month (open) + a federal Consent Order — the most active enforcement record
