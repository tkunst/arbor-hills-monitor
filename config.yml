# --- GFL "informational website" change-watch (Stream S, ADR 041, added 2026-09-11) ---
# OFF BY DEFAULT. A daily snapshot + change-diff watch on the OPERATOR's own
# public info site for Arbor Hills (arborhillslandfill.com), which GFL launched
# 2026-09-10 to address community questions about the proposed expansion. Unlike
# every other stream (which watches EGLE / county systems), this watches GFL's
# OWN narrative — the signal is WHEN and HOW that narrative changes (a FAQ answer
# edited, a claim added or walked back, a new/removed page, an email contact
# finally published). NEW EXTERNAL (non-EGLE) source — it NEVER routes through
# egle_doc_parser.
#
# When enabled, gfl_info_site_watcher.py discovers the page set (/sitemap.xml — a
# WP/Rank-Math index it follows one level — or a nav-crawl fallback, unioned with
# seed_paths), fetches each page (plain requests + a browser UA; the FAQ answers
# are server-rendered COLLAPSED accordions, so a plain GET captures the substance
# — no headless browser needed), normalizes it (isolates <main>, strips scripts /
# Cloudflare per-request tokens / nonces / ?ver= cache-busters — proven
# hash-stable across fetches, 2026-09-11), and diffs the normalized text against
# the last snapshot in the "GFL Info Site Watch" tab (that append-only tab IS the
# state AND the dated durable snapshot — no Drive/OAuth needed). The FIRST run
# baselines every page SILENTLY in one atomic write.
#
# ACTIVATION — same pattern as PFAS / Meeting Watch / the nSITE watches:
#   1. review + merge,
#   2. BEFORE flipping enabled, verify the Actions runner's fetch path is not
#      Cloudflare-walled — the residential + datacenter IPs pass, but the GitHub
#      Actions (Azure) runner IP is a different ASN Cloudflare could challenge.
#      Run the workflow_dispatch PROBE and confirm it logs green:
#        gh workflow run gfl-info-site-watch.yml -f probe=true
#      ("all seed pages fetched + normalized cleanly"). If it is walled, the
#      fallback is a self-hosted / local runner (NONE exists today — a real setup
#      step); `runs-on` in the workflow is a one-line swap.
#   3. pick recipients below (Trisha's call — an operator-narrative watch, scoped
#      VERBATIM like Meeting Watch, NOT the coalition alert_recipients list; empty
#      ⇒ DISPLAY-ONLY: durable rows, no email), then set enabled: true and commit.
# Until enabled: true is on main, gfl-info-site-watch.yml runs on schedule but
# _should_run() makes every run a quiet no-op. Keyless — no secret to provision.
gfl_info_site:
  enabled: true                            # activated 2026-09-12 (Trisha-directed) — Azure-runner probe green (run 34706429886), recipients = Trisha; see ADR 041
  base_url: "https://arborhillslandfill.com"
  sitemap_url: "https://arborhillslandfill.com/sitemap.xml"
  # The six launch-day pages (2026-09-10) — a FLOOR always checked even if
  # sitemap/nav discovery degrades; discovery adds any other content page it finds.
  seed_paths:
    - "/"
    - "/what-we-do"
    - "/landfill-improvements"
    - "/community"
    - "/faq"
    - "/location-hours"
  # Derived / noise pages excluded from the watch (regex on the URL PATH): the WP
  # HTML sitemap index (/sitemap, /sitemap/blog) and non-page assets. NOTE:
  # /privacy-policy is deliberately NOT ignored — it's a real content page, so it
  # is discovered and watched too.
  ignore_path_patterns:
    - "^/sitemap($|/)"
    - "\\.kml$"
    - "\\.xsl$"
    - "^/wp-"
  # Min <main> visible-text length for a fetch to count as the real page; a
  # shorter body is treated as a bad fetch / Cloudflare challenge and skipped,
  # never diffed into a false "changed" alert. The smallest real page
  # (/location-hours) normalizes to ~560 chars, so 150 is a safe floor.
  min_content_chars: 150
  # Cap the unified diff shown in a change email (the URL carries full context).
  max_diff_lines: 80
  # Anti-stampede: if MORE than this many pages look NEW in one steady-state run
  # (a whole-site republish, a host change, the sitemap ballooning), re-baseline
  # them silently instead of blasting new-page emails. The FIRST run baselines
  # everything atomically regardless of this cap. GFL adding >3 pages in a single
  # day is implausible; a burst is far more likely a discovery glitch. Mirrors
  # watcher.max_new_docs_per_run / wds / gfl_air anti-stampede guards.
  max_new_pages_per_run: 3
  # Recipients — used VERBATIM (Trisha only to start; the Meeting Watch / MMD /
  # RIDE precedent for a brand-new stream). A private supplement goes via
  # GFL_INFO_SITE_RECIPIENTS_EXTRA (a GitHub Secret) so it isn't committed to this
  # PUBLIC repo. EMPTY (both unset) ⇒ DISPLAY-ONLY: durable rows, NO email — it
  # never falls back to the coalition alert_recipients list (fail-safe).
  recipients:
    - arbor-hills@trishakunst.com          # Trisha only (operator-narrative watch, not the advocacy list)

# --- Public Water Supply PFAS sampling watch (Stream R, ADR 042, added 2026-09-12) ---
# OFF BY DEFAULT. A daily snapshot-diff watch on EGLE's Public Water Supply PFAS
# sampling results (the data behind the statewide MPART PFAS map) for supplies in
# the Arbor Hills capture zone. This is the DRINKING-WATER half of the PFAS story
# the landfill's own leachate/groundwater PFAS record can't see. Salem Elementary
# (WSSN 2001381) sits in the capture zone, is sampled ~annually, and has come back
# all-non-detect (<2 ppt) across six rounds Dec-2020->Feb-2025. NEW external
# (non-EGLE-document) source — a keyless ArcGIS FeatureServer, NEVER routed through
# egle_doc_parser (same ArcGIS idiom as Streams E/I/J).
#
# When enabled, pfas_pws_watcher.py fetches every watched WSSN's sampling rows
# (one query, WSSN IN (...)), snapshots each WSSN's rounds (keyed by the unique
# SysSampleCode) into the "Public Water Supply PFAS Watch" tab, and alerts on:
#   (a) a NEW sampling round appearing (even all-non-detect — "sampled again,
#       still clean" is itself the news), and
#   (b) any DETECTION of a regulated PFAS (a value that is not a `<`-limit
#       non-detect). Detections route to the shared Measurements tab
#       (basis=measured). The classifier is FAIL-SAFE: an unrecognized value
#       (a future J-flag / new token) is treated as a POSSIBLE detection (alert +
#       log), never silently dropped. NO MCL comparison is baked in — MI-2020 and
#       federal-2024 PFAS MCLs differ, so a single-regime "below MCL" label would
#       be an accuracy trap; the alert gives the raw value + analyte + date, which
#       is actionable, and points to the applicable standards (see ADR 042).
# The FIRST run per WSSN baselines silently (a historical detection is noted in
# the row, not alerted — the watch is forward-looking).
#
# ACTIVATION — same pattern as MMD / RIDE / PFAS: review + merge; the first
# enabled run baselines every WSSN silently; flip enabled here to pause/resume
# (the tab holds the state). Keyless — no secret to provision.
pfas_pws:
  enabled: true                            # activated 2026-09-13 (Trisha-directed) — keyless EGLE ArcGIS (no runner probe needed); recipients = Trisha; first run baselines silently. See ADR 042.
  # EGLE PublicWaterSupplySamplingOpenData FeatureServer, layer 1 (query endpoint).
  service_url: "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/PublicWaterSupplySamplingOpenData/FeatureServer/1/query"
  # Watched Public Water System Serial Numbers. Start with Salem Elementary
  # (in the landfill's capture zone); add other capture-zone WSSNs here as they
  # are identified — no code change needed.
  wssns:
    - 2001381    # SALEM ELEMENTARY SCHOOL, 7806 Salem Rd (Type 2 provisional WHPA; capture zone)
    - 2046881    # the landfill's own Type II supply, 10690 Six Mile Rd (EGLE name "GFL ENV - COMPOST FACILITY"); 7 rows at add, last sampled 2025-07-09 — first run baselines them silently. Added 2026-09-29 (Trisha).
    - 2037081    # the landfill's other listed supply; NO rows at add (2026-09-29) — an empty snapshot is valid, so its FIRST sampling round will alert. Added 2026-09-29 (Trisha).
  # Recipient override: Trisha only to start (Meeting Watch / MMD / RIDE / GFL-info
  # precedent for a brand-new stream). Delete/comment this block to send to the
  # full alert_recipients list once the alert copy has been seen in the wild.
  recipients:
    - arbor-hills@trishakunst.com

# --- EGLE GovQA public FOIA archive watch (Stream U, ADR 059) ---
# EGLE answers other people's FOIA requests — the operator's law firm, neighbors,
# peer-landfill watchers — and posts the requests and what it released on a PUBLIC
# archive (michiganegle.govqa.us). E614007 (8/2026) surfaced ~45 RRD files we had
# never seen that way. Daily: sweep each keyword newest-first (headless browser,
# one term per search, stopping at the first page whose requests are ALL known), re-check open/watched
# requests by number (plain session, no browser), and alert on a new matching
# request or a status change (e.g. "Cost estimate sent" -> "Closed").
# HARD RULES (pinned by tests): rows go ONLY to the PRIVATE Sheet
# (GSHEET_ID_PRIVATE) — request text and attachment names can name residents and
# street addresses; attachments (when enabled) go ONLY to a private staging Drive
# folder; nothing is ever published; an EMPTY `recipients` = display-only.
# Ships DISABLED. To activate: (1) share the private Sheet with the service account
# as EDITOR; (2) run the workflow with probe=true (checks the browser + the runner);
# (3) optional: a private staging folder (GOAUTH_GOVQA_STAGING_FOLDER_ID) + set
# download_attachments: true; (4) flip `enabled`. The first sweep of each keyword
# baselines silently. A backfill too large to scrape makes the run STOP AND ASK for
# a gridView CSV export (drop it in the folder named by GOAUTH_GOVQA_CSV_FOLDER_ID,
# shared with the service account) rather than loop on timeouts.
govqa:
  enabled: true                            # activated 2026-09-28 (Trisha) — runner probe green (run 36518570536: by-number lookup + keyword "Arbor Hills" -> 13 items); notify-only, download_attachments stays false. See ADR 059.
  # ONE term per site search. Observed 2026-09-28: the site ORs the words of an UNQUOTED
  # multi-word term (Great Lakes Recycling -> 213 items, Arbor Hills -> 97, mostly "Ann
  # Arbor …"), but honours a DOUBLE-QUOTED phrase (-> 1 and 13 items) and also matches
  # text its grid doesn't show. So multi-word terms are quoted. `require` (every listed
  # phrase must appear in the request text) is an OPTIONAL extra filter and is NOT used
  # by default: a `require: ["Salem"]` on "Six Mile" would have dropped the landfill's own
  # requests, which write "10690 6 Mile Road, Northville".
  keywords:
    - {term: '"Arbor Hills"'}
    - {term: "Holloway"}
    - {term: "10690"}
    - {term: '"Six Mile"'}
    - {term: "Napier"}
    - {term: '"Great Lakes Recycling"'}
    - {term: "10833"}            # 10833 Five Mile Rd (the number is the distinctive part; a quoted "10833 Five Mile" returns 1,637 items)
    - {term: "N2688"}
    - {term: "475946"}
    - {term: "81000004"}
  # FULL E-numbers to track by number regardless of keywords, in the archive's own form
  # E######-MMDDYY (e.g. a peer site's open request "E614606-<MMDDYY>", Liddle Sheets / Pine
  # Tree — take the date suffix from the archive). A malformed entry is reported, never a
  # crash. First sighting baselines silently; an explicit watch also overrides a no-match.
  watch_requests: []
  max_pages_per_term: 12       # a first sweep needing more pages than this => records what it read, then "export a CSV" (once)
  max_open_rechecks: 25        # recorded open requests re-checked per run, newest first
  max_attempts: 3              # per term / request: retry with a fresh session (30 s, 2 min), then report and move on
  download_attachments: false  # stage released files to the PRIVATE folder (needs the staging secret)
  time_budget_minutes: 40      # wall-clock cap per run; a phase stops and reports when it is spent (the job timeout is 60)
  max_downloads_per_run: 10
  max_file_mb: 200
  staging_folder_env: GOAUTH_GOVQA_STAGING_FOLDER_ID
  csv_folder_env: GOAUTH_GOVQA_CSV_FOLDER_ID
  held_folder_envs: []         # env names of Drive folders (read by the service account) whose files are "already held" by MD5; e.g. [GOAUTH_ARCHIVE_FOLDER_ID]
  recipients:                  # Trisha only; EMPTY = display-only (rows, no email)
    - arbor-hills@trishakunst.com

# --- Alerts ---
# Add/remove addresses by editing this list — no code change needed.
# NOTE (2026-08-21, Trisha's direction): this list is committed to a PUBLIC repo,
# so it is itself a public statement of who the monitor is associated with. Keep
# it to addresses whose public visibility is fine (Trisha's own, sitting elected
# officials). Any recipient tied to a specific advocacy organization goes via
# ALERT_RECIPIENTS_EXTRA (a GitHub Secret, comma-separated, merged in by
# email_alerts.resolve_recipients — see that function's docstring) so the
# public config never brands the monitor as that org's. Same reasoning as the
# BOC-distribution question — see the Lotext strategy doc.
alert_recipients:
  - arbor-hills@trishakunst.com          # alerts go to Trisha (Cloudflare catch-all → Gmail)
  # NOTE: additional recipients (e.g. Roland Hwang) are kept PRIVATE via the
  # ALERT_RECIPIENTS_EXTRA secret, not committed here — see email_alerts.merge_extra_recipients()
  # and tests/test_config_no_committed_emails.py. (Hwang moved out 2026-09-17, privacy pass.)

# --- MPART PFAS open-data layers watch (Stream V, ADR 060) ---
# MPART (the Michigan PFAS Action Response Team, housed at EGLE) publishes PFAS results
# as KEYLESS ArcGIS open-data layers. The monitor watches MPART's Arbor Hills WEB PAGE
# (ADR 012) and the public-water-supply layer (Stream R, `pfas_pws`) but not the layers
# that hold the Johnson Drain / Johnson Creek / upper-Rouge results, which were found by
# hand in 9/2026. Daily snapshot-diff of three layers (surface-water samples, fish PFOS
# results, and MPART's PFAS sites/AOIs); the FIRST sighting of each baselines silently;
# a new/changed/removed row alerts. The public-water-supply layer is NOT re-watched here
# (Stream R owns it; adding more WSSNs is a `pfas_pws.wssns` edit, not this block).
# New and changed surface-water rows are SCREENED against the thresholds below.
# EGLE's layer descriptions (as saved 2026-09-26) call both STATIC PULLS (surface water "last
# pulled 2/2025"; fish "01/14/2026 … updated annually"), so expect long quiet stretches and a
# burst when EGLE re-pulls; check the layer description for the current pull date.
# Ships DISABLED (a brand-new external source): review the alert copy, then flip
# `enabled`. Keyless — nothing to provision.
mpart:
  enabled: true                            # activated 2026-09-29 (Trisha-directed) — runner probe green
                                            # (run 36519697233: 17 surface-water / 388 fish / 7 sites rows,
                                            # all parsed). First run baselines silently. See ADR 060.
  # Johnson Drain / Johnson Creek / upper Rouge box: [lon_min, lat_min, lon_max, lat_max].
  bbox: [-83.66, 42.34, -83.40, 42.46]
  surface_water:
    url: "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/PfasOpenData/MapServer/0/query"
  fish:
    url: "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/FcmpOpenData/FeatureServer/1/query"
    stations: [1484, 1507]        # Johnson Drain: Fish Hatchery Park, "6-mile" — plus every station inside the box
  sites:
    url: "https://services1.arcgis.com/FNjlrOFR0aGJ71Tg/arcgis/rest/services/Michigan_PFAS_Sites_and_Areas_of_Interest_PUBLIC_view/FeatureServer/1/query"
    name_like: "Arbor Hills"      # plus every site inside the box
  # Rule 57 NON-DRINKING-WATER human non-cancer values, ng/L. Johnson Drain / Johnson Creek is
  # a non-drink water body per the monitor's own Rule 57 notes (not checked against Rule 100),
  # but the layer has no designation, so these are applied to EVERY
  # surface-water row in the box (the alert says so; drink values are PFOS 11, PFOA 66,
  # PFHxS 59, PFNA 19). Source: EGLE's Rule 57 values spreadsheet as saved 2026-09-26. Alerts
  # call this a SCREENING comparison. A sample collected before the year its CURRENT value was
  # verified is NOT screened (an older value — PFOA's was far higher, replaced in 2022 — or
  # none applied then; PFHxS and PFNA were added in 2023), an undated row IS screened, a 'K'
  # flag (EGLE: "below the Method Detection Limit/LOD") is never compared, every other flag is
  # printed as published and not interpreted, and a unit that does not read as ng/L is never compared. Keys must be PFOS/PFOA/PFHxS/
  # PFNA (a typo raises); both `thresholds_ng_l` and `thresholds_verified_year` are layered
  # over their defaults, so overriding one analyte here cannot silently drop the other three.
  thresholds_ng_l: {PFOS: 12, PFOA: 170, PFHxS: 210, PFNA: 30}
  thresholds_verified_year: {PFOS: 2014, PFOA: 2022, PFHxS: 2023, PFNA: 2023}
  stale_alert_after_skips: 3      # a liveness alert after this many consecutive unreadable runs (repeated weekly)
  # A SUCCESSFUL response that is empty, or smaller than this fraction of what was recorded
  # (must be in (0, 1]), is treated as a republish glitch: recorded as `shrink-held` (its own
  # counter, separate from fetch failures), not diffed, and accepted only once the SAME
  # shrunken response has been held on `accept_shrink_after_skips` earlier runs — so it cannot
  # fire "REMOVED (17)" then re-announce all.
  max_shrink_fraction: 0.5
  accept_shrink_after_skips: 2
  recipients:                     # Trisha only; EMPTY = display-only (rows, no email)
    - arbor-hills@trishakunst.com

# --- Weekly digest "Upcoming Activities" section (ADR 027) ---
# The Sunday digest's calendar section is sourced from a SEPARATE, PRIVATE Sheet
# (GSHEET_ID_PRIVATE) that may carry strategy-flavored key dates the public
# case-file Sheet must not. Because that content is confidential it is sent as its
# OWN email to `recipients` below — NEVER folded into the coalition document digest
# (which still goes to the full alert_recipients list above). Scoped to Trisha ONLY
# to start, so the section can be tested before it is widened; widen it via
# ALERT_RECIPIENTS_EXTRA-style private handling, never advocacy-org addresses
# committed here. NEVER add the operator (GFL) — that would defeat the
# private Sheet's entire purpose. FAIL-SAFE: if this list is empty or removed the
# upcoming email is simply NOT sent (the private content is never broadcast to the
# full list by default). The whole section is also a no-op unless GSHEET_ID_PRIVATE
# is set. See upcoming.py + docs/decisions/027.
upcoming:
  recipients:
    - arbor-hills@trishakunst.com        # Trisha only while testing (widen here later)

# Urgent triggers -> same-day email. Procedural items -> weekly digest as action
# items. Everything else -> weekly Sunday digest.
urgent:
  severity_is_urgent: true       # any doc the parser marks "urgent"
  # Urgency fires only on a MEASURED temperature at/above this (deg F). A
  # permitted ceiling / HOV-waiver limit at this value does NOT fire — that
  # conflation would discredit the artifact. See docs/decisions/004.
  # Same number as temperature_thresholds.mact_f below, via a YAML anchor, so
  # the two can never drift apart (classifier-untrusted-input follow-up, 2026-10-14).
  measured_temp_urgent_f: &mact_limit_f 145    # MACT limit
  # Lower watch threshold: EPA gas-well operating limit. Tracked for trend
  # comparison and (future) a Watch tier; does not fire an urgent alert today.
  measured_temp_watch_f: 131

# Temperature reference thresholds (deg F), for downstream trend/tier logic.
temperature_thresholds:
  epa_gas_operating_f: 131       # EPA gas-well operating limit (watch)
  mact_f: *mact_limit_f          # MACT limit (urgent); anchored to urgent.measured_temp_urgent_f
  # Well-specific Higher Operating Values EGLE has approved at Arbor Hills
  # (2024-04-30 grant: 150/160/170; 2024-07-10 replacement wells; 2023 grants
  # at 155; AHW272R4 at 180 on 2025-02-19, the only 180; AHW263R5 at 170 on
  # 2025-07-23; 2026-04-07 renewal). Used ONLY by kdp_check.py (ADR 067) to
  # recognize an HOV value named in classifier prose. Add a value here when a
  # new HOV letter sets one.
  hov_values_f: [150, 155, 160, 170, 180]
  # The only well(s) holding the top HOV value above (180°F). kdp_check flags
  # classifier text that gives that value to any other well (Trisha 2026-10-12).
  top_hov_wells: [AHW272R4]
  # Per-well approved HOV ceilings, for CONTEXT in the [URGENT] email body only
  # (email_alerts.hov_ceiling_for, coder:keydatapoint-guard). Never a trigger
  # or a suppressor: every measured reading at/above measured_temp_urgent_f
  # alerts regardless. Exact well id (a redrill is a different well); ids are
  # the canonical spellings the ADR 068 alias map produces. Filled 2026-10-17
  # from the five EGLE AQD letters in hand (Lotext source-docs/hov-etlf/):
  # 4/30/2024 15-well renewal (to 5/1/2026), 7/10/2024 four replacement wells,
  # 2/19/2025 AHW272R4, 7/23/2025 AHW263R5, 4/7/2026 16-well renewal (to
  # 5/1/2028). Each window starts at the earliest letter granting that exact
  # id. The 2019-2023 grant letters were never pulled, so a reading dated
  # before 2024-04-30 matches no entry. A well with no matching entry is
  # labeled "Approved ceiling for <well> not in this monitor's roster"
  # (not "no approval exists"). Add a row when a new HOV letter arrives.
  hov_ceilings:
    # 4/7/2026 renewal (Table 1), continuous with the 2024/2025 grants at the same value.
    - {well_id: AHWW258R, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHW259R5, ceiling_f: 170, effective_start: "2024-07-10", effective_end: "2028-05-01"}
    - {well_id: AHW272R4, ceiling_f: 180, effective_start: "2025-02-19", effective_end: "2028-05-01"}
    - {well_id: AHWW0279, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHW285R3, ceiling_f: 170, effective_start: "2024-07-10", effective_end: "2028-05-01"}
    - {well_id: AHWW287R, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWW290R, ceiling_f: 170, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWW0300, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWW301R, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWW302R, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHW311R2, ceiling_f: 150, effective_start: "2024-07-10", effective_end: "2028-05-01"}
    - {well_id: AHW312R2, ceiling_f: 160, effective_start: "2024-07-10", effective_end: "2028-05-01"}
    - {well_id: AHWW0313, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWW0315, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2028-05-01"}
    - {well_id: AHWWTS01, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2028-05-01"}  # leachate sump
    - {well_id: AHWTS01R, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2028-05-01"}  # leachate sump
    # 4/30/2024 grant only; replaced by the R-redrills above (7/10/2024). End
    # is that grant's stated term; no letter revoked them.
    - {well_id: AHW259R4, ceiling_f: 170, effective_start: "2024-04-30", effective_end: "2026-05-01"}
    - {well_id: AHW285R2, ceiling_f: 170, effective_start: "2024-04-30", effective_end: "2026-05-01"}
    - {well_id: AHWW311R, ceiling_f: 150, effective_start: "2024-04-30", effective_end: "2026-05-01"}
    - {well_id: AHWW312R, ceiling_f: 160, effective_start: "2024-04-30", effective_end: "2026-05-01"}
    # 7/23/2025 grant states no end date, but the well is not in the 4/7/2026
    # renewal, which says the existing waivers lapse 5/1/2026. The end date
    # below is the last date the waiver is CONFIRMED in force, not a lapse any
    # letter states (Trisha 2026-10-17). Update if EGLE confirms its status.
    - {well_id: AHW263R5, ceiling_f: 170, effective_start: "2025-07-23", effective_end: "2026-05-01"}
  # Above this, a "°F" number in a sentence about wells is treated as a
  # misread column (e.g. H2S ppm), never a wellhead temperature. Flare and
  # combustion sentences are exempt (kdp_check.py). Such a number never fires
  # an URGENT alert on its own, but it is no longer dropped silently: it is
  # logged to the Parser Review Flags tab (review_flags.py, ADR 067 amendment
  # 2026-10-15), as is a WOI table reading above it (woi_router).
  max_plausible_wellhead_f: 250

# --- Owner-only "For Trisha only" channel (owner_notices.py, coder:owner-weekly-email) ---
# A Sunday email to the OWNER addresses only (unsubscribe.owner_addresses +
# MONITOR_OWNER_EMAILS; never alert_recipients, the digest list or any watch
# list): filings the monitor could not read, hand-curated rows nobody routed,
# alert emails that failed to send, and parser review flags. Plus a same-day
# owner-only email when an unreadable filing has an enforcement title, or a
# parse produced a temperature above max_plausible_wellhead_f. Both ship off.
owner_weekly:
  enabled: true  # activated 2026-10-16 (Trisha)
  # Same-day owner alerts (unreadable enforcement notice; above-ceiling
  # temperature). Separate switch so the weekly can run without them.
  enforcement_alert_enabled: true  # activated 2026-10-16 (Trisha)
  # Hand-curated rows added before this date are never listed (the backlog
  # predates the routing log).
  hand_curated_since: "2026-10-15"

# --- Report expectations tracker (ADR 071) ---
# report_tracker.py + .github/workflows/report-tracker.yml: expands the
# hand-edited Expected Reports / Trigger Rules tabs on the PRIVATE Sheet into
# due instances, matches arrivals from the existing streams, and keeps the
# never-deleted Missing & Overdue Log. Writes ONLY its own seven private tabs;
# read-only on every existing tab. Seed the hand tables once with
# `python3 report_tracker_seed.py --apply` (dry run by default) before
# enabling. A brand-new job built unattended, so it ships disabled.
report_tracking:
  enabled: true   # activated 2026-10-23 (Trisha); shadow fortnight below
  # Days after an instance's due date before it is called missing. Blank
  # `grace_days` on an Expected Reports row means this value; a number on the
  # row overrides it for that report type. Either change takes effect on the
  # next run (Trisha's decision 2, 2026-10-20).
  default_grace_days: 7
  # Instances are expanded this far past today so the Runs row can count
  # what is "coming due" (ADR 071 step 2).
  lookahead_days: 30
  # Report-only period after activation: while today <= this date the Runs
  # row's mode is "shadow" and the briefing line says so (ADR 071 risk 1:
  # the first two weeks run in report-only mode). Blank = live. Set it to
  # activation day + 14 when flipping `enabled`.
  shadow_until: "2026-11-06"
  # Sunday owner-only email listing the week's review items (proposed
  # matches, unmatched periodic titles, rejected hand-table rows). Recipients
  # are the owner addresses ONLY (owner_notices.send_owner_email); empty
  # owner set = no send. Separate switch so the tabs can run without it.
  review_email_enabled: false
  # Decision 4 (2026-10-20): EGLE's own records are never arrivals. A record
  # whose title matches this is skipped before any match rule is tried and
  # is never listed as an "unmatched periodic" title either. Inspection and
  # enforcement records only: EGLE's HOV approval letters are deliberately
  # NOT here, because `hov-approval` / `hov-plan-approval` are expected
  # one-time instances in the ADR's vocabulary and need to be matchable.
  # Anchored where a word is common in operator titles (an operator's
  # "Email ... transmitting the NESHAP report" is a filing). A skipped title
  # that still reads periodic is shown once in Report Tracker Review.
  agency_title_regex: "On-Site Inspection|Inspection \\(|Inspection Report|Violation Notice|Enforcement Notice|^Consent Order|Compliance Communication|Evaluation Report|Air Quality Test Observation|^Schedule - |^Email\\b"
  # A record no rule matched is reported for a schedule fix (owner review)
  # when its title reads as a PERIODIC report (ADR 071 match_rule section):
  # a cadence word, not a bare "Report" (lab reports, test reports and
  # staff reports are not schedules).
  periodic_title_regex: "Semi-?Annual|\\bQuarter|Monthly|Bi-?Monthly|\\bAnnual\\b"

# --- CAN-SPAM unsubscribe for the multi-recipient alert emails (ADR 040) ---
# Applied at the single send choke point (email_alerts.send_email), so ALL
# multi-recipient streams inherit it: the same-day [URGENT] alerts, the Sunday
# digest, and the GFL-air perimeter WATCH email (plus any other multi-recipient
# send). Mechanism is a List-Unsubscribe *mailto* + a compliant footer — the send
# path is plain SMTP and there is no web backend (static GitHub Pages), so
# RFC-8058 one-click is not available.
#
# ARMING: the apparatus is armed when `mailto` below is set (a working opt-out is
# the one required element). There is deliberately NO enabled flag — "mailto
# configured" IS the switch. `postal_address` is OPTIONAL. Until armed (no mailto),
# a non-owner (third-party) recipient is HELD (not sent) rather than sent mail with
# no way to opt out; Trisha's own addresses (owner_addresses + owner_domains + the
# MONITOR_OWNER_EMAILS secret) are always sent and never carry a footer.
#
# RESOLVED (Trisha 2026-09-13; see ADR 040 amendment):
#   - postal_address: NOT required — these are advocacy (non-commercial) alerts.
#     Left EMPTY on purpose; the footer omits the postal line. LIVE via mailto.
#   - opt-out granularity: v1 is GLOBAL (unsubscribe = all monitor mail);
#     per-stream opt-out is a documented follow-on.
#   - capture: v1 is a mailto to the monitored inbox + MANUAL triage into the
#     UNSUBSCRIBED_EMAILS secret; an auto-reader is a documented follow-on.
unsubscribe:
  # The opt-out mailbox. A @trishakunst.com alias (Cloudflare catch-all → Gmail)
  # is public-safe to print. This is THE arming switch: set = apparatus armed
  # (non-owners get the header + footer); blank it and non-owners are held.
  mailto: unsubscribe@trishakunst.com
  # OPTIONAL physical postal address. These are advocacy (non-commercial) alerts,
  # so CAN-SPAM's physical-address rule does not apply; Trisha's call (2026-09-13)
  # is to expose none. EMPTY = the footer simply omits the postal line (still
  # armed via mailto). Set it later (e.g. a PO box) only if you want one printed.
  postal_address: ""
  # Clear sender identity printed in the footer (neutral, per the data-layer
  # posture — this is the monitor, not any advocacy org).
  sender_identity: "Arbor Hills Monitor"
  # Why the recipient is getting the email (footer line). Recipients are added
  # manually (there is no signup form), so this says "added," not "subscribed."
  receiving_reason: "You are receiving this because your address was added to the Arbor Hills Monitor alert list."
  # Trisha's OWN addresses — never suppressed, never held, never footered. The
  # non-sensitive catch-all lives here (it is already public in alert_recipients);
  # PRIVATE addresses (proton / gmail) go in the MONITOR_OWNER_EMAILS *secret*,
  # not here. List EVERY owner address that appears on ANY recipient list.
  owner_addresses:
    - arbor-hills@trishakunst.com
  # Whole domains that are Trisha's — ANY address at them is treated as an owner
  # (never suppressed, held, or footered). @trishakunst.com is a Cloudflare
  # catch-all that forwards to her, so every alias at it is hers; listing the
  # DOMAIN covers present + future aliases without enumerating them. A domain is
  # not sensitive, so it lives here; private personal addresses (gmail/proton/
  # yahoo) go in the MONITOR_OWNER_EMAILS secret instead.
  owner_domains:
    - trishakunst.com
  # NOTE: the SUPPRESSION LIST is intentionally NOT here — opted-out third-party
  # addresses are PII and this repo + the case-file Sheet are PUBLIC. They live in
  # the UNSUBSCRIBED_EMAILS secret (comma/semicolon list), read at send time.

# --- EGLE newsroom watch (egle_newsroom_watcher.py; Trisha-directed 2026-10-01) ---
# Polls https://www.michigan.gov/egle/newsroom (server-renders only the newest 4
# items, hence the frequent schedule in egle-newsroom-watch.yml) and emails the
# scoped recipients when a NEW item matches the keywords below (article body
# only; "Related News" excluded). First run baselines silently. Enabled at ship
# on Trisha's explicit request (not the overnight-coder default): the first run
# sends nothing, and a runner-side bot wall fails loudly (exit 1).
egle_newsroom:
  enabled: true
  listing_url: "https://www.michigan.gov/egle/newsroom"
  recipients:
    - arbor-hills@trishakunst.com          # Trisha (scoped; never the shared list)
  gap_min_items: 4    # all listed items new => "you may have missed some" email
  keywords:
    # Alert on any hit (title or body).
    specific: ["Arbor Hills", "GFL", "Emerald RNG", "N2688", "Johnson Creek",
               "Johnson Drain", "Salem Township", "Arbor Hills Energy"]
    # Alert only together with a topic term (county names show up in statewide
    # lists, e.g. the 2026-09-28 spotted-lanternfly item lists Washtenaw).
    area: ["Washtenaw", "Northville", "Plymouth Township", "Superior Township",
           "Rouge River", "Middle Rouge", "Wayne County", "Salem"]
    # Alert if one is in the title, or topic_min_body_hits distinct ones in the body.
    topic: ["landfill", "landfills", "solid waste", "Part 115", "materials management",
            "wetland", "wetlands", "water quality monitoring", "monitoring request",
            "Targeted Monitoring Request", "GLWARM", "public comment", "public hearing",
            "PFAS", "leachate", "groundwater", "permit to install", "consent order",
            "consent judgment", "violation notice", "odor", "landfill gas",
            "renewable natural gas", "methane", "Part 303", "Part 201", "dewatering"]
    topic_min_body_hits: 2
