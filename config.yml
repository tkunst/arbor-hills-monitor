# --- Document classification ---
# Haiku was the deliberate cost choice for the 754-doc backfill (~$2-4 total);
# routine monitoring is a few docs/day, essentially free either way. Bumped to
# Sonnet 5 (2026-09-20, Trisha-directed) after a large keyword-windowed doc (the
# 875-page Q1 2026 VGC Well Report) produced a digest summary that reported only
# the compliant-well count and silently dropped ~2/3 non-compliant wells. Model
# quality alone doesn't fix the windowing (large_doc_page_threshold/
# large_doc_max_keyword_pages below still caps what the classifier ever sees),
# but a stronger model is a free upgrade for the pages it IS shown.
anthropic_model: "claude-sonnet-5"
# Output cap for the classification call. Generous enough that measurements[]
# on a multi-well WOI report isn't truncated mid-JSON. If a doc ever fails with
# "Classification truncated at max_tokens", raise this.
# Raised 8192 -> 16384 on 2026-06-15: of the 17 docs that poisoned out in the
# multi-facility backfill, 2 were genuine 8192-token classification overflows
# (recovered by this bump via a RETRY_POISONED=1 run). The OTHER 15 poison docs
# are NOT a token problem — they are legacy .doc (Word) source files whose nSITE
# downloadpdf endpoint returns HTTP 400 (~13) plus 2 unscannable images; raising
# max_tokens does nothing for those. See the "known unprocessable" note in
# README / docs. Haiku output is $5/1M tok, so the headroom is spent only on
# docs that actually need it.
classification_max_tokens: 16384

# Large-document handling: docs with more pages than this get targeted
# keyword-window extraction instead of full text (saves tokens, better
# key_data_point). The two WOI Status Reports are 181 and 323 pages.
large_doc_page_threshold: 30
large_doc_max_keyword_pages: 10

# --- Document Date + real titles for generic nSITE titles (ADR 065) ---
# nSITE files a lot of documents under generic filing-system titles that tell a
# reader nothing ("Site", "nForm Document", ...). `generic_exact` is matched
# case-insensitively as a whole title; `generic_prefixes` as a case-insensitive
# startswith (so every "Schedule - ..." title counts, not just one exact
# string — a real scan of the live N2688 corpus found 8/8 "Schedule -" docs
# were substantive EGLE letters, 0 genuine schedule stubs; other facilities'
# own "Schedule - DMR"/"Schedule - Submit..." titles ALSO start with
# "Schedule - " and are swept in too — confirmed via real specimens to be
# genuine stubs, which is harmless: a genuine stub's classifier never finds a
# usable display_title, so it just keeps its plain nSITE title). A doc whose
# title matches is flagged `title_is_generic` for the classifier (asked to
# propose a real display_title — see egle_doc_parser.py) and for the
# "CORRESPONDENCE & ENFORCEMENT" digest-tier bump (see email_alerts.
# is_correspondence_letter). `overrides` is a doc_id -> display name map for
# docs Trisha has hand-verified (precedence: overrides > classifier
# display_title > the raw nSITE title — see document_titles.resolve_display_name).
# The 9 below are carried over from the retired schedule-title-overrides.md
# handoff's hand-verified rename map (8 "Schedule -" N2688 docs + 1 "nForm
# Document"); this block absorbs and supersedes that handoff.
document_titles:
  generic_exact:
    - "nForm Document"
    - "Site"
    - "Submission PDF"
    - "Submital Attachments"
    - "Correspondence"
  generic_prefixes:
    - "Schedule - "
