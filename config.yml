# Open_Release is early, citable R5 (water quality) signal. Statuses change
# rarely — near-silent in steady state. The FIRST sighting of each watched
# item baselines silently. See ride_client.py / ride_watcher.py.
#
# Built 2026-07-23/24 (unattended overnight) and shipped disabled per the
# new-source gate; the live feasibility re-check confirmed all 6 records return
# (7 since 00038889 was added 2026-09-28).
# ACTIVATED 2026-08-07 (Trisha-directed) — keyless, nothing to provision. The
# first run baselines every watched item silently; alerts go to `recipients`
# below (Trisha only to start).
ride:
