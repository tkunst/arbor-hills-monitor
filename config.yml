# --- PFAS page-watch (ADR 012, added 2026-07-12) ---
# OFF BY DEFAULT. A lightweight content-hash watch on EGLE's PFAS-investigation
# page(s) for Arbor Hills — prose EGLE edits in place when the investigation
# moves, with no structured feed or per-record PDFs to parse. When enabled,
# pfas_watcher.py fetches each page, isolates its <main> content (ignoring the
# Sitecore theme cache-busters that rotate on every state-wide redeploy — see
# pfas_client.py for why a whole-page hash would false-alarm constantly), hashes
# it, and emails an alert (with a visible-text diff) when it changes vs. the last
# snapshot in the "PFAS Page Watch" tab. The FIRST sighting baselines silently.
#
# ACTIVATION — same three-step pattern as Stream C / Mirror D:
#   1. review + merge,
#   2. the first enabled run just baselines every page (records a hash, alerts on
#      none) — no seed script needed,
#   3. set enabled: true here and commit.
# Until enabled: true is on main, pfas-watch.yml runs on schedule but
# pfas_watcher._should_run() makes every run a quiet no-op.
pfas:
  enabled: true                     # activated 2026-07-12 (Trisha) — see ADR 012
  # Minimum <main> visible-text length for a fetch to count as the real page; a
  # shorter body is treated as a bad fetch / bot-wall error page and skipped,
  # never diffed into a false "changed" alert.
  min_content_chars: 200
  pages:
    - label: "Arbor Hills Landfill PFAS investigation"
      url: "https://www.michigan.gov/pfasresponse/investigations/sites-aoi/washtenaw-county/arbor-hills-landfill"

# --- GFL perimeter air (Stream E, ADR 014, added 2026-07-14) ---
# OFF BY DEFAULT. The FIRST source of real fenceline READINGS (R3 odor / R4 air),
# not documents: GFL self-reports HOURLY H2S (ppb) and CH4 (ppm) at six perimeter
# stations (MS-1..MS-6) on a public ArcGIS dashboard backed by a keyless Barr
# Engineering FeatureServer. When enabled, gfl_air_watcher.py polls the readings
# table incrementally (OBJECTID cursor stored in the "GFL Air" tab — NOT _meta, so
# a separate workflow can't clobber the daily watcher's state), writes readings to
# the shared Measurements tab (basis=measured), refreshes a small latest-per-station
# snapshot, and emails a same-day alert when a reading crosses a config action level
# using the stream's OWN classifier (never the temperature-oriented is_urgent).
#
# ACTIVATION — same three-step pattern as Stream C / Mirror D / PFAS. All Trisha's:
#   1. review + merge,
#   2. the first enabled run just baselines the current readings (records the
#      snapshot + sets the cursor, alerts on NONE) — no seed script needed, and it
#      cannot blast the ~214k-row history,
#   3. CONFIRM the alert thresholds below (a wrong threshold floods or starves —
#      see ADR 014). H2S 72 ppb is already settled (equivalent across both air
#      monitors); CH4 = 500 ppm (NESHAP corrective-action level, set 2026-07-17 per
#      overnight-worker #75). Then set enabled: true here and commit.
# Until enabled: true is on main, gfl-air.yml runs on schedule but
# gfl_air_watcher._should_run() makes every run a quiet no-op. It is keyless — no
# secret to provision.
gfl_air:
  enabled: true
  # Barr Engineering ArcGIS Enterprise FeatureServer (public, GET-only). The
  # readings live in the "Monitoring Data" table (layer 4). Verified 2026-07-14.
  service_url: "https://enterprisegis.barr.com/server/rest/services/GFL/GFL_Arbor_Hills_Public_Web_Data/FeatureServer"
  readings_layer: 4
  dashboard_url: "https://barrgisonline.maps.arcgis.com/apps/dashboards/ac08a03f8018403ba6ae1c2243c00e99"
  station_prefix: "MS-"             # perimeter gas stations; excludes the stale "10-Meter MET Tower" row
  # Station ROSTER (coder:h2s-roster-count, 2026-10-23): the human-maintained list of
  # perimeter stations that are SUPPOSED to exist. This is the single source of truth
  # for the SCREENING email's "stations reporting N/<len>" count and its "not listed"
  # note — adding or removing a monitor is a one-line edit here, not a code change.
  # Distinct from the live layer-0 REGISTRY (gfl_air_client.fetch_station_coords:
  # what the source lists right now, fetched every run): a registry/reading station
  # NOT on this list is logged + named in the email as "not in this monitor's
  # configured roster" (never silently counted as one of the expected N, never
  # silently dropped); a roster station the source doesn't list at all is named as
  # "not listed". Names must carry station_prefix exactly as the feed spells them.
  # Six names as of PR #107's 2026-10-06 live specimen (MS-1..MS-6); re-check against
  # the live service before changing.
  expected_stations:
    - MS-1
    - MS-2
    - MS-3
    - MS-4
    - MS-5
    - MS-6
  max_record_count: 2000            # page size for the incremental OBJECTID query (service cap is 10000)
  # Which readings land in the shared Measurements tab. The feed is hourly (~288
  # rows/day at 'all'), so the default 'digest' keeps every exceedance + a per-
  # station daily peak (~12/day) — the source feed stays the system of record for
  # full hourly history. Set 'all' for full fidelity in the Sheet. See ADR 014.
  measurements_mode: digest
  # Exceedance ACTION LEVELS.
  #   h2s_ppb 72 — CONFIRMED (equivalent across BOTH air monitors, 2026-07-14):
  #     72 ppb is BOTH the Michigan EGLE H2S ITSL (100 µg/m³, 24-hr avg ≈ 72 ppb)
  #     AND the Ridge Wood Elementary monitor's OWN published 24-hr action level
  #     (data-sources item 8 / Stream G, ADR 016). Two independent official sources agree, so
  #     this value is settled — not "pending confirmation". 72 ppb is a 24-HOUR-AVERAGE
  #     level, so Stream E fires the H2S exceedance alert on a rolling per-station 24-hr
  #     AVERAGE (computed server-side; see h2s_avg_window_hours below and ADR 014
  #     decision 4), matching the level's own averaging period rather than a single
  #     instantaneous hour. Set h2s_avg_window_hours: 0 to restore the old
  #     instantaneous behavior. The operator also publishes a 750 ppb 15-MINUTE ACUTE
  #     level; adding that as a higher-urgency second tier is a small follow-on (needs a classifier tier).
  #     Lower odor-nuisance ~5-8 ppb stays a 'watch' reference, not the alert
  #     (H2S>=5 ppb hit ~2874× in 4 yrs — it would flood).
  #   ch4_ppm 500 — SET 2026-07-17 (was 12500), per overnight-worker #75 air-thresholds
  #     research (Lotext: documents/arbor-hills/draft/DRAFT-arbor-hills-air-thresholds-research-2026-07-16.md).
  #     500 ppm = the NESHAP surface-emission corrective-action level (40 CFR 63.1958(d) /
  #     Michigan Part 115). A PERIMETER reading of 500 ppm is NOT itself a NESHAP violation
  #     (NESHAP is a surface-scan standard, not a fenceline reading), but it is a meaningful
  #     regulatory signal. 500 < the old 12500 (25% LEL / 40 CFR 258.23), so this alert is
  #     strictly MORE protective — it still catches anything that would have hit 12500, and
  #     will not flood (perimeter readings run ~4-27 ppm, so 500 fires only on a real gas-
  #     migration event, ~20x normal). The 40 ppm 'early-warning watch' (GFL's own perimeter
  #     alarm level; not a health standard, ~0.08% LEL) has a classifier tier that DOES email
  #     (see watch_thresholds below + watch_alert_recipients) — same as the H2S 750 ppb
  #     15-min follow-on noted above, which is still a genuine open follow-on.
  thresholds:
    h2s_ppb: 72
    ch4_ppm: 500
  # H2S 24-hr ROLLING AVERAGE (coder:gfl-air-24h-average, added 2026-07-18). The
  # 72 ppb H2S action level above is itself a 24-HOUR-AVERAGE level, so the H2S
  # exceedance alert fires when the trailing per-station AVERAGE over this many hours
  # is >= h2s_ppb — matching the level's own averaging period instead of over-alerting
  # on one hot hour. Computed server-side in one cheap ArcGIS grouped-stats query
  # (avg + count per station) using a UTC `date` literal (NOT a `TIMESTAMP` literal —
  # the layer's date fields are fixed EST/UTC-5, so a TIMESTAMP cutoff would silently
  # shift the window ~5h; see ADR 014 decision 4 + gfl_air_client.fetch_h2s_window_avg).
  #   h2s_avg_window_hours 24 — the averaging window. Set to 0 to restore the OLD
  #     instantaneous H2S alert (a rollback lever). CH4 is NEVER averaged — its 500 ppm
  #     level is an explosivity/surface-emission boundary, not a 24-hr-average health
  #     level, so CH4 stays instantaneous. Individual instantaneous readings still land
  #     in the Measurements tab unchanged (basis=measured); only the H2S ALERT changes.
  #   h2s_avg_min_readings 12 — a sparse-window guard: if a feed gap leaves fewer than
  #     this many readings in the window, the average alert is SUPPRESSED (and logged),
  #     so a couple of readings can't masquerade as "the 24-hr average". A healthy feed
  #     posts hourly (~23-24 readings/window; verified live 2026-07-18), so 12 is a safe floor.
  h2s_avg_window_hours: 24
  h2s_avg_min_readings: 12
  # WATCH thresholds — the CJ PERIMETER ACTION-LEVEL tier. A reading STRICTLY ABOVE a
  # watch level (¶5.5 "above"; the raw unrounded numeric) but below the matching
  # exceedance action level above drives the consolidated per-(station,gas) OPEN +
  # CLOSE screening/closeout emails (ADR 039, added 2026-09-10) — one email per daily
  # run, to watch_alert_recipients (below). OPTIONAL + partial: only pollutants listed
  # here get a watch tier; a gas omitted here is DISPLAY-ONLY (no episode, no alert).
  #   h2s_ppb 30 — the CJ Perimeter H2S Action Level (Consent Judgment 2020-0593-CE
  #     ¶def T), a 15-MINUTE ROLLING AVERAGE. The public feed is HOURLY only, so this
  #     alerts on any hourly reading above 30 ppb as the closest available PROXY — a
  #     SCREENING lead for EGLE, NOT a determination that the 15-min rolling-average
  #     level was exceeded (which needs AHL's nonpublic ~1-min data). This proxy likely
  #     UNDERCOUNTS true CJ exceedances. This is the CJ's OWN enforceable fenceline
  #     trigger and is stricter+faster than the 72 ppb / 24-hr ITSL exceedance tier
  #     above; it crossed 30 ppb only 56x on 24 days across the ~4.4yr record (~34
  #     per-station episodes), not a flood — the ~5-8 ppb odor-nuisance level (which
  #     WOULD flood, ~2874x) is deliberately NOT used.
  #   ch4_ppm 40 — the CJ Perimeter Methane Action Level (¶def U), also a 15-min
  #     rolling average, applied to hourly readings as the same screening proxy. At
  #     40 ppm AHL must run a root-cause analysis + CORRECT within 48 hrs (¶5.5(E)) and
  #     report it to EGLE (¶6.3). Not a health standard (~0.08% of the methane LEL);
  #     sits below the 500 ppm NESHAP exceedance tier. MOVED into the ADR-039
  #     consolidated model 2026-09-10 (was the standalone CH4-40 watch).
  watch_thresholds:
    h2s_ppb: 30
    ch4_ppm: 40
  # WATCH-tier recipients — the audience for the ADR-039 consolidated action-level
  # screening system (rebuilt 2026-09-10 from the 2026-07-21 CH4-only watch). Per
  # daily run this list gets AT MOST: one consolidated SCREENING (OPEN) email listing
  # ALL six monitors' verbatim readings for BOTH gases (flagging strictly-above) when
  # >=1 (station,gas) episode opens, and one CLOSEOUT (CLOSE) email with start/peak/
  # return/duration per episode when >=1 closes. A continuing-only run (elevated but
  # nothing newly opened/closed) sends NOTHING (no re-alert). These emails are NEVER
  # mixed into the full-list [URGENT] exceedance/anomaly email, so the whole
  # distribution list isn't pinged for a sub-exceedance action-level lead.
  # Real-specimen backtest (live feed, 2026-09-10): H2S>30 = 56 crossings on 24 days
  # (~34 per-station episodes), CH4>40 = ~368 episodes across ~4.4yr — <=1 open-email
  # per exceedance-day, not a flood. Empty list = DISPLAY-ONLY (the rollback lever):
  # the episode engine is skipped entirely (no OPEN/CLOSE emails, no episode-log
  # writes), and the watch status still shows on the GFL Air snapshot tab.
  # RESOLVED 2026-08-21 (Trisha's neutral-branding pass): like alert_recipients
  # above, this list is committed to a PUBLIC repo. A second recipient here now
  # goes via GFL_AIR_WATCH_RECIPIENTS_EXTRA (a private env/secret, merged in by
  # email_alerts.merge_extra_recipients) instead of being committed here — the 5
  # county commissioners join this list ~2026-09-17.
  watch_alert_recipients:
    - arbor-hills@trishakunst.com          # Trisha
  # Sentinel / no-data values in the feed (ambiguous no-data vs off-scale-high).
  # Excluded from the measured series; surfaced as anomalies. ADR 014 RECOMMENDS
  # treating them as alert-worthy (fail-safe — don't infer 'benign' when the
  # semantics are unknowable); flip alert_on_sentinel to false to silence them.
  sentinels:
    h2s_ppb: 999
    ch4_ppm: 99999
  alert_on_sentinel: true
  # Anti-stampede: if one poll yields more new readings than this (e.g. the source
  # reinserts the whole table, bumping every OBJECTID), re-baseline instead of
  # blasting the case file (mirrors wds.max_new_wds_alerts_per_run /
  # watcher.max_new_docs_per_run). Normal daily volume is ~144 (6 stations × hourly).
  max_new_readings_per_run: 1000
  # LIVENESS guard (ADR 014's OBJECTID-reset silent-stall mitigation). If a poll
  # finds ZERO new readings AND the newest reading on record is older than this many
  # days, send ONE 'feed appears stale' alert (its own message, NOT an exceedance) —
  # so a permanent silent zero (e.g. Barr rebuilds the service and OBJECTIDs reset
  # below the stored cursor, making `OBJECTID > cursor` return nothing forever) can't
  # look identical to "no new readings." Fires at most once per stale episode.
  # Default 3 days = 72h: the healthy feed's largest gap in 4+ yrs (2022-05..2026-07,
  # 36,446 hourly stamps) is 17h and it has NEVER gone quiet >24h, so 72h is a ~4.2×
  # margin that cannot false-fire on normal cadence (verified live, 2026-07-15).
  max_stale_days: 3
  # Durable air-readings exhibit (ADR 026, Gap G1-E-1/G3-E-1). ACTIVATED 2026-08-08:
  # the app-only Drive folder "Arbor Hills GFL Air Exhibit" was created (via the
  # create-oauth-folder workflow, from the stored GOAUTH creds) and its id set as
  # the GOAUTH_GFL_AIR_FOLDER_ID secret (Trisha-only, like GOAUTH_MMPC_FOLDER_ID /
  # GOAUTH_RIDGEWOOD_FOLDER_ID). With enabled: true below, each poll uploads an
  # IMMUTABLE JSON of the selected readings {monitor_id, timestamp, H2S, CH4, wind
  # dir/speed, temp}: >= 1 row per `baseline_hours` per station, PLUS every reading
  # for a station during an exceedance/watch (Tier-1 CH4 >= 40) period. The monthly
  # summary PDF is rendered from these files only when an exhibit is actually needed
  # (deferred). Rollback lever: set enabled: false to return _write_capture() to a
  # silent no-op (the folder + secret can stay).
  # 2026-10-06 (Trisha: "make sure we have a backup of all actual readings for both
  # CH4 and H2S... Don't want to rely on that dashboard staying live"): mode "all"
  # captures EVERY hourly perimeter reading with every source field verbatim
  # (numeric H2S/CH4, the BDL labels, wind, temp, humidity, pressure). ~150
  # readings/day. "sample" restores the original 1-per-baseline_hours downsample.
  capture:
    enabled: true
    mode: all
    baseline_hours: 8
  # 2026-10-06 (Trisha): HOURLY capture too, so a reading sits in GFL's feed for about
  # an hour (not up to a day) before we hold a copy. gfl_air_hourly_capture.py via its
  # own workflow; cursor derived from the capture file names in Drive (no Sheet
  # state); no alerts. Rollback: enabled: false (the daily capture is unaffected).
  hourly_capture:
    enabled: true
    max_readings_per_run: 5000

# --- GFL perimeter feed: monthly FULL snapshot + change detection (ADR 063) ---
# Once a month, pull EVERY row of every layer of GFL's public perimeter-air feed
# (~226k hourly H2S/CH4 readings, all fields verbatim) + the dashboard config into
# one zip with a manifest (row counts checked against the server's own count,
# SHA-256 per file), upload it to the app-only GFL Air Exhibit Drive folder
# (GOAUTH_GFL_AIR_FOLDER_ID), and diff it against the previous snapshot: past
# readings DELETED or EDITED upstream email the OWNER list only. The backstop for
# anything the daily capture (gfl_air.capture) misses. Ships false (new job
# against a live external system); a human flips it on.
gfl_feed_snapshot:
  enabled: true   # switched on 2026-10-06 (Trisha: "merge and push 108 and 109")
  page_size: 5000
  dashboard_item_url: "https://barrgisonline.maps.arcgis.com/sharing/rest/content/items/ac08a03f8018403ba6ae1c2243c00e99"

# --- CivicClerk meeting-change watch (Stream F, ADR 015, added 2026-07-14) ---
# Watches a HAND-PICKED list of Washtenaw County CivicClerk meeting events for ANY
# change — title, date/time, publish status, cancellation, or its agenda/minutes/
# other document set — and emails a change alert. Distinct from Mirror D
# (mmpc_archive: below), which only MIRRORS category-72 (MMPC) PDFs to Drive by
# fileId and is blind to a meeting being moved/renamed/cancelled or a doc replaced,
# AND covers no Board-of-Commissioners meetings at all. This watch downloads
# nothing; the deliverable is the ALERT. See civicclerk_watcher.py + ADR 015.
#
# CADENCE is a pure function of (config, today), NOT the cron: meeting-watch.yml
# fires twice daily and each event decides if it's due (is_due_today). MMPC =
# every run; BOC = weekly (weekly_weekday, Mon=0) PLUS daily in the N days before
# each meeting (daily_before_days), so a last-minute agenda/cancellation is caught.
#
# RECIPIENTS below are used VERBATIM (Trisha only) — NOT the shared
# alert_recipients list — because meeting-logistics changes are hers to triage.
#
# ACTIVATION note: ships enabled. Unlike a classified feed this cannot flood — the
# FIRST run BASELINES every event silently (records a snapshot, alerts on none),
# exactly like pfas_watcher. Flip enabled:false to pause without deleting the tab.
civicclerk_watch:
  enabled: true
  recipients:
    - arbor-hills@trishakunst.com          # Trisha only (not the advocacy list)
  # KEYWORD SCAN (ADR 036, added 2026-09-03) — closes the county-side gap: a GFL
  # plan-amendment, siting application, MMP consistency-determination, or "Good
  # Neighbor Plan" agenda item can be agendized on a CivicClerk meeting with
  # nothing ever touching EGLE's nSITE system, which every other watcher in this
  # repo depends on. When enabled, every Agenda/Minutes file that is NEW or
  # CHANGED on a due-checked event (across every group below, hand-picked or
  # auto-discover) is downloaded and its text scanned against `keywords` — a hit
  # elevates that event's alert (subject + a prominent excerpt block naming the
  # matched keyword and the file), and even overrides an otherwise-silent FIRST
  # sighting of a brand-new meeting whose agenda already carries a hit.
  # DELIBERATELY FAIL-OPEN: two entries ("consistency", "siting") are short and
  # will match ordinary county business unrelated to Arbor Hills (verified
  # empirically before shipping — see ADR 036's false-positive-rate note) —
  # kept anyway, exactly as directed, because a keyword scan that misses a real
  # hit is worse than one that occasionally over-fires; every alert names its
  # matched keyword + a short excerpt so a false positive is a two-second read.
  # Coverage is AGENDIZED items only — a raw paper/UPS county filing that never
  # reaches a public meeting agenda is outside what any web-based watch can see
  # (a FOIA gap; see ADR 036).
  keyword_scan:
    enabled: true
    keywords:
      - "Arbor Hills"
      - "plan amendment"
      - "amend the plan"
      - "consistency"
      - "consistency determination"
      - "letter of consistency"
      - "siting"
      - "GFL"
      - "landfill expansion"
      - "Good Neighbor Plan"
      - "materials management plan amendment"
      - "251 acre"
      - "92 acre"
      - "Six Mile"
      - "Eggermont"
  groups:
    # MMPC — the Materials Management Planning Committee (category 72). AUTO-DISCOVER
    # mode (Trisha 2026-09-04): the county DOES add MMPC meetings mid-year — 2025 ran
    # monthly incl. Oct 8 + Nov 12, plus a Sep 18 special meeting — so the old
    # hand-picked event list (4005/4006/4007) would MISS a newly-posted Oct/Nov or
    # special siting meeting whose event id it can't know in advance. Enumerating
    # category 72 each run (same mode as the DPW group below) catches any new event by
    # id and baselines it silently on first sighting. Checked every run (2x/day) — the
    # siting arc is high-stakes. (Verified 2026-09-04: the cat-72 API returns 4006/4007
    # plus every future event, so discovery sees new meetings the moment they post.)
    - name: "MMPC"
      cadence: every_run
      category_id: 72
      discover_since_days: 400
    # Washtenaw County Board of Commissioners — Working Session (category 27,
    # 5:30 PM) + Board Meeting (category 26, 7:00 PM). Less critical → weekly, but
    # daily in the 3 days before each meeting. Every date below HAS a live portal
    # page (unlike MMPC's Oct/Nov). Dec 2 is a meeting only (no working session).
    - name: "Washtenaw County BOC"
      cadence:
        weekly_weekday: 0                  # Monday
        daily_before_days: 3
      events:
        - {id: 3975, event_date: "2026-08-05", label: "BOC Working Session — Aug 5, 2026"}
        - {id: 3940, event_date: "2026-08-05", label: "BOC Meeting — Aug 5, 2026"}
        - {id: 3976, event_date: "2026-09-02", label: "BOC Working Session — Sep 2, 2026"}
        - {id: 3941, event_date: "2026-09-02", label: "BOC Meeting — Sep 2, 2026"}
        - {id: 3965, event_date: "2026-09-16", label: "BOC Working Session — Sep 16, 2026"}
        - {id: 3953, event_date: "2026-09-16", label: "BOC Meeting — Sep 16, 2026"}
        - {id: 3977, event_date: "2026-10-07", label: "BOC Working Session — Oct 7, 2026"}
        - {id: 3942, event_date: "2026-10-07", label: "BOC Meeting — Oct 7, 2026"}
        - {id: 3966, event_date: "2026-10-21", label: "BOC Working Session — Oct 21, 2026"}
        - {id: 3954, event_date: "2026-10-21", label: "BOC Meeting — Oct 21, 2026"}
        - {id: 3978, event_date: "2026-11-04", label: "BOC Working Session — Nov 4, 2026"}
        - {id: 3943, event_date: "2026-11-04", label: "BOC Meeting — Nov 4, 2026"}
        - {id: 3967, event_date: "2026-11-18", label: "BOC Working Session — Nov 18, 2026"}
        - {id: 3955, event_date: "2026-11-18", label: "BOC Meeting — Nov 18, 2026"}
        - {id: 3944, event_date: "2026-12-02", label: "BOC Meeting — Dec 2, 2026"}
    # Washtenaw County Board of Public Works / DPA (category 68) — added
    # 2026-09-03 to close the county-side gap: GFL's landfill-expansion siting
    # arc can be agendized here (drain/easement, road, or public-works items
    # tied to the expansion) without ever touching EGLE's nSITE system, which
    # every other watcher in this repo depends on. UNLIKE MMPC/BOC above, the
    # county does NOT pre-create future DPA event stubs (confirmed live
    # 2026-09-03: nothing exists past the meeting that already happened), so a
    # hand-picked events: list can never see next month's meeting before this
    # watch's own check discovers it. This group uses AUTO-DISCOVER mode
    # (category_id, no events: list) instead — civicclerk_watcher.py fetches
    # the whole category each due run and diffs by event id, same as a
    # hand-picked event. discover_since_days bounds the fetch to recent +
    # future meetings; the DPA's full history is covered once by the one-time
    # 12-month keyword backfill (see ADR 036), not re-baselined every run.
    - name: "Washtenaw County Board of Public Works (DPA)"
      cadence: every_run
      category_id: 68
      discover_since_days: 400

# --- Ridge Wood Elementary H2S monthly reports (Stream G, ADR 016, added 2026-07-14) ---
# OFF BY DEFAULT. Barr Engineering (the same consultant behind Stream E) runs an H2S
# air monitor at Ridge Wood Elementary School under a U.S. EPA agreement and posts a
# monthly, QA'd, born-digital 24-hour-average PDF report to a public page. This is a
# DOCUMENT-archive source (the "new PDF appears -> mirror + extract" shape of Mirror
# D / mmpc_archiver), NOT a live numeric feed like Stream E. When enabled,
# ridgewood_archiver.py scrapes the report list off the page (never constructs a URL —
# the filename carries an unpredictable cache-buster), diffs by YYYY-MM against the
# "Ridge Wood Reports" tab, mirrors each new PDF to Drive, extracts the month's max
# 24-hr average into the shared Measurements tab (basis=measured, attributed to the
# Barr/EPA monitor), and emails a same-day alert on a stated 24-hr exceedance of 72 ppb
# or 15-min exceedance of 750 ppb. The 72 ppb level is the SAME one Stream E ships
# (cross-confirmed across both air monitors, ADR 014); 750 ppb is a new acute level.
#
# ACTIVATION — same pattern as Stream C / Mirror D / PFAS / GFL air. All Trisha's:
#   1. review + merge,
#   2. provision the Drive folder secret GOAUTH_RIDGEWOOD_FOLDER_ID (a NEW folder for
#      the Ridge Wood PDFs — see scripts/setup notes + ADR 016). The three shared
#      GOAUTH_CLIENT_ID/_SECRET/_REFRESH_TOKEN secrets are already live. This secret
#      is OPTIONAL: without it the stream still extracts + alerts, it just doesn't
#      mirror to Drive (the exceedance alert never depends on the mirror).
#   3. set enabled: true here and commit. The first enabled run backfills ~66
#      historical months (alerts SUPPRESSED during the backfill — those are years-old
#      all-clear reports; their data is still recorded), then steady-state ~1/month.
# Until enabled: true is on main, ridgewood.yml runs on schedule but
# ridgewood_archiver._should_run() makes every run a quiet no-op.
ridgewood:
  enabled: true                     # activated 2026-07-15 (Trisha) — see ADR 016. GOAUTH_RIDGEWOOD_FOLDER_ID provisioned + full 66-month backfill mirrored 2026-07-15.
  page_url: "https://arborhillsmonitoring.com/Home/Ridgewood"
  # Relative /Files/... report links on the page are absolutized against this host.
  base_url: "https://www.arborhillsmonitoring.com"
  # Published action levels (the monitor's own; ADR 016). h2s_24h_ppb is checked
  # against the report's numeric daily 24-hr averages; h2s_15min_ppb is the acute
  # level cited in the alert text (a 15-min exceedance only ever appears in prose, so
  # the classifier catches it via the ABSENCE of the report's all-clear statement —
  # see ridgewood_client.classify_report, which is fail-safe + footnote-safe).
  thresholds:
    h2s_24h_ppb: 72
    h2s_15min_ppb: 750
  # Anti-stampede / timeout guard: process at most this many new months per run
  # (newest first, resumable via the dedup tab). A run draining more than this is a
  # historical backfill -> alerts suppressed for it. Normal monthly volume is 1.
  max_new_reports_per_run: 12
  # Two-tier alert routing. A real 24-hr EXCEEDANCE (a numeric daily value >=
  # h2s_24h_ppb) is a public-health signal and goes to the full alert_recipients
  # list below. The lower-severity REVIEW-tier alerts (missing all-clear phrase /
  # no text layer / parse anomaly — "someone should check this report") are
  # operational and go to review_recipients VERBATIM (Trisha only), the same
  # per-watch override the meeting-watch uses, so the external advocacy list isn't
  # emailed about a format hiccup. Leave review_recipients empty/unset to send
  # review-tier alerts to the full list too.
  review_recipients:
    - arbor-hills@trishakunst.com          # Trisha only (not the advocacy list)
  # Monthly RE-VERIFICATION pass + committed provenance manifest (ADR 066, added
  # 2026-10-12; ridgewood_reverify.py). OFF BY DEFAULT. Stream G above archives a
  # month's report ONCE and never looks at it again; this re-downloads EVERY listed
  # month monthly, detects a silently REVISED PDF (new version mirrored, old one
  # never touched/deleted) and a report that disappears from Barr's page, and
  # commits data/provenance/ridgewood-manifest.json (one entry per report version;
  # the git commit history is the provenance "signature" — Trisha's 2026-10-08
  # ruling, no cryptographic signing). Change/removal alerts are OWNER-ONLY
  # (ea.load_owner_emails) — never the public or review_recipients/alert_recipients
  # lists above. ACTIVATION (same pattern as Stream G itself): review + merge, then
  # set reverify_enabled: true and commit. The Drive folder secret
  # (GOAUTH_RIDGEWOOD_FOLDER_ID) is shared with Stream G and already optional there;
  # unset here too, a revision is still logged + alerted, just without a mirrored
  # copy of the new bytes.
  reverify_enabled: true            # activated 2026-10-12 (Trisha) — see ADR 066. GOAUTH_RIDGEWOOD_FOLDER_ID/MONITOR_OWNER_EMAILS already provisioned (shared with Stream G / GFL snapshot).

# --- ROP (air Title V permit) watch (ADR 017, added 2026-07-15) ---
# OFF BY DEFAULT. All three Arbor Hills air facilities have a ROP renewal IN
# PROCESS: N2688 (landfill, ROP0000224 v3), N1504 (Energy, ROP0000656 v3), P1488
# (Emerald RNG, ROP0000236 v3). A renewal reaching its 30-day PUBLIC COMMENT
# window is a second advocacy venue (air-permit conditions) — easy to miss amid
# a ~1,800-row statewide CSV. When enabled, rop_watcher.py watches THREE public
# EGLE sources and alerts on any change:
#   1. the EPA ROP Monthly Report CSV (facility-level workflow tasks) for the
#      three target SRNs below — task-status / permit-status / dates advancing,
#      or a new task/version row appearing (e.g. N2688's renewal sub-task "Send
#      working draft conditions to applicant" going Unstarted -> started);
#   2. the N2688 renewal folder's file list — a new file (a draft renewal ROP /
#      staff report);
#   3. the statewide ROP_Public_Notice.pdf — whether each target SRN (N2688 /
#      N1504 / P1488) appears, one item per facility (the 30-day-comment-window
#      trip-wire; broadened from N2688-only 2026-07-23 after P1488's window slipped through).
# The FIRST sighting of each of the seven derived items baselines silently, same
# as pfas_watcher/civicclerk_watcher. See rop_client.py / rop_watcher.py.
#
# ⚠️ M3333 ("Conway Products Corporation d/b/a Emerald Spa Corp") is an
# unrelated facility that also contains "Emerald" in its name (P1488 is
# "Emerald RNG LLC") — rop_client filters by exact SRN, never by name, so
# M3333 can never be pulled in by construction.
#
# ACTIVATION — same three-step pattern as Stream C / Mirror D / PFAS / GFL air /
# Ridge Wood. All Trisha's:
#   1. review + merge,
#   2. the first enabled run just baselines all seven items (records a snapshot,
#      alerts on NONE) — no seed script needed,
#   3. set enabled: true here and commit.
# Until enabled: true is on main, rop-watch.yml runs on schedule but
# rop_watcher._should_run() makes every run a quiet no-op.
rop:
  enabled: true                      # activated 2026-07-16 (Trisha) — see ADR 017
  srns:
    - "N2688"    # Arbor Hills Landfill — the primary advocacy concern
    - "N1504"    # Arbor Hills Energy
    - "P1488"    # Emerald RNG
  # Optional per-watch recipient override (Trisha only, like Meeting Watch /
  # Ridge Wood's review_recipients). Leave unset to send to the full
  # alert_recipients list below — the default, since a ROP renewal advancing
  # (especially reaching public comment) is a substantive signal for the whole
  # distribution list, not an operational/format concern.
  # recipients:
  #   - arbor-hills@trishakunst.com

# --- EGLE MMD Open Data watch (Stream I, ADR 018) ---
# Daily snapshot-diff on EGLE Materials Management Division's KEYLESS ArcGIS
# registry (gisagoegle.state.mi.us .../EGLE/MmdOpenData/MapServer, layer 0 —
# the master (facility, module) table). This is the STATE'S OWN registry view
# of the facility: one watched item per wdsid below, alerting on any change to
# its record set — a disposal-area/Part 115 status flip, the map-hidden
# (show=0) compost registration changing or surfacing, or a watched wdsid
# APPEARING in the service at all (465941 is absent today; its first record
# showing up means the state has started tracking the compost/expansion
# parcel). Statuses change rarely — near-silent in steady state. The FIRST
# sighting of each wdsid baselines silently (an EMPTY record set is a valid
# baseline). See mmd_client.py / mmd_watcher.py.
#
# ACTIVATION — same pattern as Stream C / Mirror D / PFAS / GFL air / Ridge
# Wood / ROP: review + merge; the first enabled run just baselines; flip
# enabled here to pause/resume without losing state (the MMD Watch tab).
mmd:
  enabled: true                      # activated at build (Trisha's 2026-07-21 "automate for monitor to use it") — see ADR 018
  wdsids:
    - 475946   # Arbor Hills Landfill, Inc — landfill + (map-hidden) compost registration records
    - 465941   # Arbor Hills Compost Area — ABSENT from the service today; appearing = trip-wire
  # Recipient override: Trisha only to start (Meeting Watch precedent for a
  # brand-new stream). Delete/comment this block to send to the full
  # alert_recipients list once the alert copy has been seen in the wild.
  recipients:
    - arbor-hills@trishakunst.com

