# --- nSITE Active Public Notices watch (Stream Q, ADR 032) ---
# Watch on the "Active Public Notices" profile — the formal comment-window
# announcements (permit renewals, draft permits, hearings) — the EIGHTH and
# LAST sibling profile to Documents (`facilities:`), Submissions, Violations,
# Compliance Actions, Evaluations, Permits, and Complaints above. ONE fetch
# per site -> ONE item ("pubntc:<srn>"); the FIRST sighting of each site's
# notice list baselines silently. Diff is REF-NUMBER-KEYED like Evaluations/
# Permits, but on an id regex-extracted from the notice's own URL
