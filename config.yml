    AHLI: quarterly
    P1504: quarterly
    AHLA: quarterly
    AHLB: quarterly
    AHLC: quarterly
    AHLD: quarterly
    AHLE: quarterly
    ADL1: quarterly
    ADL2: quarterly
    COMP: quarterly   # 1 complaint, 2014-08-06 — ancient, insurance only
    AHE1: quarterly
    AHE2: quarterly
    SANL: quarterly
    ERNGX: quarterly
    NAPR: quarterly      # ADR 044 (WRP034436 Napier Rd culvert)
    LFLO: quarterly      # ADR 045 (low-flow request site, ~5-yr cadence)
    DTEN: quarterly      # ADR 046 (DTE Nitro NPDES MI0060368)
