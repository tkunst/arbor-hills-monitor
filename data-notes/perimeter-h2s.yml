# Perimeter H2S data-quality note — the SINGLE SOURCE OF TRUTH.
#
# Edit this file, then run:
#     .venv/bin/python scripts/sync_data_notes.py --pages          # rewrite the site pages
#     .venv/bin/python scripts/sync_data_notes.py --release        # release notes + zip README (needs `gh`)
# (`--all` does both.) tests/test_sync_data_notes.py fails CI if any site page drifts from
# this file. Pushing a change to this file to `main` also runs the release sync
# automatically (.github/workflows/data-notes.yml).
#
# Two parts, on purpose:
#   * `html` / `footer_html` — what the website says about the LIVE feed today.
#   * `release_md` — what the downloadable dataset's release notes and zip README say.
#     It scopes the suspect ranges to the bundle's own date range, and labels anything
#     after the bundle's cutoff as live-feed status, so nobody is told that rows they hold
#     are bad when those rows were fine.
#
# Times are Eastern (America/Detroit). Source for every figure: GFL's public perimeter feed
# (Barr Engineering FeatureServer, layer 4). The 2026-09-25 version was queried 2026-09-25 ~10:40 ET
# and checked by two independent reviewers against the raw feed. The 2026-10-06 update re-queried
# the feed through 2026-10-06 11:00 ET and CORRECTED the bundle bullets: MS-1 (constant 3.0/3.1,
# 2025-05-28 to 2026-05-28) and MS-3 (constant 5.4, 2025-07-15 to 10-16; 3.1 for a week in
# Nov-Dec 2025) had been described as varying normally. Two blind refuters checked this version.
# The 2026-10-09 refresh re-queried the feed through 2026-10-09 12:00 ET (queried 13:33 ET) and
# updated only the live-status sentences (MS-6 stopped reporting after 2026-10-06 17:00; MS-2 and
# MS-5 read 0.0 in all but one hour since 2026-10-06 11:00; still no hourly H2S >= 30 ppb since
# 2026-09-14) and added the MS-2 constant-0.0 methane week (2026-09-16 21:00 to 09-24 19:00, the
# only constant-CH4 run of 100+ readings at MS-2 in the full record). Two blind refuters checked
# the final text (2026-10-09 evening); no factual errors, wording tightened.

id: perimeter-h2s
as_of: "October 9, 2026, 12:00 p.m. ET"

# Rendered inside <p class="data-quality-note"> (variant "callout") on every page.
html: >-
  <strong>Data-quality note (updated October 9, 2026; corrects the September 25 note):</strong>
  for long stretches, several fence-line stations' hydrogen-sulfide (H2S) channels have
  reported a single constant value while the station kept reporting and its methane channel
  kept varying. A sensor in clean air can legitimately read 0.0 for weeks or even months, but a
  constant non-zero value for months, or a constant 0.0 for more than a year while
  neighboring stations vary, is a standard data-quality flag, not evidence of clean air.
  The feed marks every reading below 7&nbsp;ppb as "BDL" (below detection limit), apart
  from a small number with no label, and that includes the stuck 3.0&ndash;3.2 and
  5.4&nbsp;ppb values described here. So the BDL label cannot tell a stuck sensor from a
  working one, and a "BDL" reading is not on its own evidence that the air was clean.
  GFL's public dashboard shows only these labels (for both hydrogen sulfide and methane),
  not the numbers, so a stuck sensor and a working one look the same there; the numeric
  values are available in the feed's underlying data service and in this project's
  dataset. <strong>Now:</strong> MS-3 and MS-4 are reporting
  varying readings. MS-5 and MS-2 have resumed varying readings only recently, so their
  records are short: MS-5 since September 26, 2026 (up to 11.0&nbsp;ppb), after reading
  0.0 from May 28, 2025 (apart from one 0.1&nbsp;ppb reading) and sending no data from
  September 16 to 26; MS-2 since September 24, 2026 (up to 2.3&nbsp;ppb), after reading
  0.0 from June 30, 2025; for its last week of that stretch, from 9&nbsp;p.m. on September 16
  to 7&nbsp;p.m. on September 24, MS-2's methane channel also read a constant 0.0&nbsp;ppm.
  Since 11&nbsp;a.m. on October 6, MS-5 and MS-2 have each read
  0.0&nbsp;ppb in all but one hour. MS-6 read 3.0&ndash;3.2&nbsp;ppb from May 28, 2025
  (apart from two readings on June 11, 2026) until 11&nbsp;a.m. on September 29, 2026, when it
  dropped to 0.0&nbsp;ppb; it then sent no data after 5&nbsp;p.m. that day until it resumed at 11&nbsp;a.m.
  on October 5, read 0.0&nbsp;ppb H2S and 0&ndash;2&nbsp;ppm methane every hour through
  5&nbsp;p.m. on October 6, and has sent no data since. MS-1 has sent no data
  since noon on September 17, 2026, after reading exactly 0.0 for both gases from 9&nbsp;p.m.
  on September 16. <strong>Earlier:</strong> MS-1 read a constant 3.0 or 3.1&nbsp;ppb from
  May 28, 2025 to May 28, 2026, starting the same hour MS-5 and MS-6 went flat; MS-3 read
  a constant 5.4&nbsp;ppb from July 15 to October 16, 2025, and 3.1&nbsp;ppb from November
  24 to December 1, 2025, the same value MS-1 and MS-6 read in those hours. A quiet record
  at a station during these periods is not evidence of clean air. The stations then reporting
  varying readings recorded hourly values above 30&nbsp;ppb (the 2022 Consent Judgment's
  fence-line action level, which is defined on a 15-minute rolling average; an hourly value
  from the public feed is a screening signal, not a confirmed crossing), most recently on
  September 14, 2026, up to 153.4&nbsp;ppb at MS-1 (which has sent no data since
  September 17). None of the stations reporting varying readings has recorded an hourly value at or above 30&nbsp;ppb since. These are observations from GFL's public perimeter
  feed, hosted by Barr Engineering; the cause has not been publicly confirmed by GFL, EGLE
  or Barr Engineering. Status as of October 9, 2026, 12:00&nbsp;p.m.&nbsp;ET.

# Rendered as the text of a page footer (variant "footer").
footer_html: >-
  An independent project. Fence-line readings come from the operator's public perimeter
  feed, hosted by Barr Engineering; as of October 9, 2026, several stations'
  hydrogen-sulfide readings have known data-quality problems (see the data-quality note).

# Markdown for the GitHub release notes and the README inside the release zip.
release_md: |-
  **Data-quality note (updated 2026-10-09; corrects the 2026-09-25 note, which described MS-1 and MS-3 as varying normally).** Several stations' hydrogen-sulfide (H2S) channels have reported a single constant value for long stretches while the station kept reporting and its methane channel kept varying. That is a constant value on a live station, not a data gap. A sensor in clean air can read 0.0 for weeks or even months, but a constant non-zero value for months, or a constant 0.0 for more than a year while neighboring stations vary, is a standard data-quality flag. The feed's `H2S_Text` column marks every reading below 7 ppb as `BDL` (below detection limit), apart from a small number of rows with no label, and that includes the stuck `3.0`-`3.2` and `5.4` values listed below. So the `BDL` label cannot tell a stuck sensor from a working one: do not treat `BDL` as evidence of clean air, and use the suspect periods below rather than the label to filter. GFL's public dashboard shows only the `H2S_Text` and `CH4_Text` labels, not the numeric values, so a stuck sensor and a working one look the same there; this dataset keeps the numeric `H2S` and `CH4` values.

  *Affects the data in this bundle (which ends 2026-09-06 00:00 UTC):*

  - **MS-1** `h2s_ppb` is a constant `3.0` from 2025-05-28 16:00 ET (previous hour 1.3), `3.1` from 2025-07-03 11:00 ET, and `3.0` again from 2026-05-14 11:00 ET, through 2026-05-28 12:00 ET; it varies again from 2026-05-28 13:00 ET (0.6). Treat 2025-05-28 16:00 to 2026-05-28 12:00 ET as suspect.
  - **MS-2** `h2s_ppb` is a constant `0.0` from 2025-06-30 07:00 ET onward (last non-zero reading 2025-06-30 06:00 ET). Treat as suspect.
  - **MS-3** `h2s_ppb` is a constant `5.4` from 2025-07-15 14:00 ET through 2025-10-16 17:00 ET, and a constant `3.1` from 2025-11-24 12:00 ET through 2025-12-01 12:00 ET (the same value MS-1 and MS-6 read in those hours). Treat both periods as suspect. Its long runs of exactly `0.0` at other times are consistent with clean air.
  - **MS-4** varies through the end of this bundle; its long runs are exactly `0.0`, consistent with clean air.
  - **MS-5** `h2s_ppb` is a constant `0.0` from 2025-05-28 16:00 ET onward (last non-zero reading 0.2 at 2025-05-28 15:00 ET, a single-hour value; apart from it, MS-5 had read `0.0` since 2025-02-21 20:00 ET). Treat as suspect.
  - **MS-6** `h2s_ppb` moved from `0.7` (2025-05-28 15:00 ET) to a constant `3.2` at 2025-05-28 16:00 ET, the same hour MS-1 and MS-5 went flat, and has read only `3.0`-`3.2` since, apart from two readings on 2026-06-11 (2.4 ppb at 13:00 ET and 0.5 ppb at 14:00 ET). Treat as suspect from 2025-05-28 16:00 ET.

  Do not read the absence of high H2S readings at a station during its suspect period as verified clean air.

  *Live feed after this bundle's cutoff (status as of 2026-10-09 12:00 ET; these readings are not in this bundle):* MS-5's last reading before a gap was 2026-09-16 21:00 ET and its next was 2026-09-26 19:00 ET (its only non-zero value in the flat period was 0.1 ppb on 2026-09-14 15:00 ET); since then it has reported varying values, up to 11.0 ppb (2026-09-29 04:00 ET). From 2026-09-16 21:00 ET, MS-1 read exactly `0.0` for both H2S and CH4; its last reading was 2026-09-17 12:00 ET. MS-2's methane (`ch4_ppm`) read a constant `0.0` from 2026-09-16 21:00 ET through 2026-09-24 19:00 ET (191 hourly readings, after no readings from 2026-09-16 11:00 to 20:00 ET; its only stuck-methane stretch of a week or more in the record). That is the same hour MS-1 went to exactly `0.0` for both gases and MS-5 sent its last reading before a 10-day gap. MS-2 reported its first non-zero H2S value since June 2025 on 2026-09-24 (0.1 ppb at 23:00 ET) and has since reported small varying values, up to 2.3 ppb (2026-10-01 19:00 ET). From 2026-10-06 11:00 ET through 2026-10-09 12:00 ET, MS-5 and MS-2 each read `0.0` in all but one hour (MS-5 0.1 ppb at 2026-10-09 02:00 ET; MS-2 0.5 ppb at 2026-10-09 11:00 ET). MS-6 moved to a constant `3.1` on 2026-09-23, read `0.0` from 2026-09-29 11:00 ET, had no readings between 2026-09-29 17:00 ET and 2026-10-05 11:00 ET, read `0.0` ppb H2S and 0-2 ppm CH4 every hour from 2026-10-05 11:00 ET through 2026-10-06 17:00 ET, and has sent no data since. MS-3 and MS-4 are reporting varying readings; MS-5 and MS-2 have resumed only recently. On 2026-09-14 the stations then reporting varying readings recorded hourly H2S above 30 ppb (the 2022 Consent Judgment's fence-line action level, defined on a 15-minute rolling average; an hourly value is a screening signal, not a confirmed crossing): MS-1 153.4 ppb (13:00 ET), MS-3 65.4 ppb (14:00 ET), and MS-4 67.9 ppb (14:00 ET) and 46.8 ppb (15:00 ET). None of the stations reporting varying readings has recorded hourly H2S at or above 30 ppb since.

  These are observations from GFL's public perimeter feed, hosted by Barr Engineering; the cause has not been publicly confirmed by GFL, EGLE or Barr Engineering.

